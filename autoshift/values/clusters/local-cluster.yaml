# from /home/danclark/workspace/rhoai-mass-aws/cluster.env and the live cluster. Re-run that script rather than
# editing by hand; it is regenerated, not merged.
#
# The key below is the ACM ManagedCluster name, which for a hub managing itself
# is 'local-cluster' - not the installer's cluster name (rhoai).
clusters:
  local-cluster:
    config:
      clusterSet: 'hub'
    labels:
      # GPU nodes. The policy clones this cluster's worker MachineSet, so the
      # subnet, AMI, security groups and IAM profile are discovered at
      # reconcile time and deliberately absent here.
      gpu-nodes: '1'
      gpu-nodes-provider: aws
      gpu-nodes-instance-type: 'g6.xlarge'
      gpu-nodes-zone-1: 'us-east-2a'
      gpu-nodes-region: 'us-east-2'
      gpu-nodes-spot: 'false'
