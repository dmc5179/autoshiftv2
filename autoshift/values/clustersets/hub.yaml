# Hub Cluster Sets with Feature Flags. Blank will remove
hubClusterSets:
  hub:
    config:
      # =====================================================================
      # openshift-ai-models — which models this cluster serves
      # =====================================================================
      # Required by the openshift-ai-models label. A model is a structured
      # record, not a string, so it lives here rather than in a label.
      openshiftAiModels:
        namespace: 'llm'
        maasNamespace: 'models-as-a-service'
        gateway:
          name: 'maas-default-gateway'
          namespace: 'openshift-ingress'
        models:
          - name: 'granite-4-tiny-gpu'
            displayName: 'RedHatAI Granite 4.0-h-tiny FP8'
            # servedModelName defaults to name. Overriding it so the two
            # disagree returns 404 "the model X does not exist" at inference
            # time, long after every policy reports Compliant.
            uri: 'oci://registry.redhat.io/rhai/modelcar-granite-4-0-h-tiny-fp8-dynamic:3.0'
            # Pinned by digest, not by tag. There is no :3.0 tag on this
            # repository — the pod fails with `manifest unknown`, which
            # presents as ImagePullBackOff on the runtime container while the
            # modelcar pulls fine, so it looks like a model problem.
            image: 'registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:5800e12b2a465f15961fcf34b645d79ed4f91ec9161eab22b1205d12682183c8'
            replicas: 1
            gpus: 1
            requestsCpu: '2'
            requestsMemory: '8Gi'
            limitsCpu: '4'
            limitsMemory: '24Gi'
            tokenRateLimit: 50000
            tokenRateWindow: '1m'
            # Tool calling. Off unless a parser is named, and the parser is
            # model-specific: granite-4.0-h-* -> granite4, Qwen3 -> hermes,
            # gpt-oss -> openai, Llama 3.1 -> llama3_json (which also needs
            # chatTemplate). Gemma has no parser and cannot do tool calling.
            # Required for OpenShift Lightspeed or any agentic client.
            toolCallParser: 'granite4'
      # Manual remediations - STIG findings the Compliance Operator ships no fix for, because each
      # needs a site decision. Enabled by the manual-remediations label below; every entry renders
      # nothing until its key is set. See docs/compliance.md.
      #
      # imageRegistries and oauth are commented out because neither is safe as a shipped default.
      #
      # allowedRegistries is enforced by CRI-O on every node, and anything not listed cannot be
      # pulled. The three below cover a plain hub, but AutoShift policies also reference docker.io
      # and registry.access.redhat.com (cluster-install, ACM provisioning) and
      # registry.connect.redhat.com (vault). Add every registry your enabled policies use, then
      # confirm with: oc get pods -A -o jsonpath='{..image}' | tr ' ' '\n' | cut -d/ -f1 | sort -u
      # Running pods are unaffected, so a missing entry surfaces on the next pull, not on sync.
      #
      # oauth names Secrets holding login HTML that must be created in openshift-config first; see
      # docs/compliance.md for the commands. Referencing Secrets that do not exist is not something
      # to ship by default.
      manualRemediations:
        classificationBanner:
          text: 'UNCLASSIFIED'
          location: 'BannerTopBottom'
          color: '#ffffff'
          backgroundColor: '#008000'
        motd: |
          You are accessing a U.S. Government (USG) Information System (IS) that is provided for
          USG-authorized use only. By using this IS (which includes any device attached to this
          IS), you consent to the following conditions: the USG routinely intercepts and monitors
          communications on this IS; at any time, the USG may inspect and seize data stored on this
          IS; communications using, or data stored on, this IS are not private and are subject to
          routine monitoring, interception, and search.
        # Owns the default project template. Both halves are off: quotas are a per-application
        # sizing decision that belongs with whatever creates the namespace, and networkPolicies
        # would put a deny-by-default policy in every new project, which blocks the kube-apiserver
        # reaching an admission webhook across nodes. Neither rule passes with this as it stands.
        projectTemplate:
          name: 'project-request'
          networkPolicies: false
        # Annotates every Route outside kube-* and openshift-*, which is what the rule scores.
        routeRateLimits:
          allNamespaces: true
        # imageRegistries:
        #   allowed:
        #     - quay.io
        #     - registry.redhat.io
        #     - image-registry.openshift-image-registry.svc:5000
        #   allowedForImport:
        #     - domainName: quay.io
        #       insecure: false
        # oauth:
        #   loginTemplateSecret: 'login-template'
        #   providerSelectionTemplateSecret: 'providerselect-template'
        #   errorTemplateSecret: 'error-template'
        #   logoutRedirect: 'https://example.com/logged-out'

      # Compliance Operator scans. Profiles are PINNED to a version: ocp4-stig tracks whatever
      # DISA publishes next, so an unpinned name would silently change what is measured and, with
      # autoApply on, change the cluster. Adopting a new release means adding an entry.
      #
      # autoApply is false: this scans and reports and changes nothing. Turning it on applies every
      # remediation the scan produced except those in exclude, and several are MachineConfigs that
      # reboot every node, in more than one round. Hardening is a deliberate choice, so layer
      # hub-hardened.yaml on top rather than flipping this. See docs/compliance.md.
      compliance:
        # Findings a person has reviewed and accepted. policy-stig-manual-review reports every
        # MANUAL result, every FAIL with no remediation, and any INCONSISTENT result that failed on
        # a node, and stays NonCompliant until each one is listed here or fixed.
        #
        # The reason is the audit record. Write what was actually checked and what was found.
        # Accept a finding only when nothing can be done about it; one with a real fix belongs
        # fixed, not accepted. Names carry the profile version, so a bump reopens every acceptance.
        manualReview:
          accepted: []
        scans:
          - name: stig-v2r3
            profiles:
              - ocp4-stig-v2r3
              - ocp4-stig-node-v2r3
              - rhcos4-stig-v2r3
            scanSetting: default
            autoApply: false
            # These four rewrite the default project template so every new project gets a
            # deny-by-default NetworkPolicy and a ResourceQuota, and ship only that restrictive
            # half. Deny-by-default blocks the kube-apiserver, breaking admission webhooks (Red Hat
            # Advanced Cluster Security) and the cluster-manager namespaces; the quota rejects every
            # pod that declares no resources. Use manualRemediations.projectTemplate instead.
            exclude:
              - ocp4-stig-v2r3-project-config-and-template-network-policy
              - ocp4-stig-v2r3-project-config-and-template-network-policy-1
              - ocp4-stig-v2r3-project-config-and-template-resource-quota
              - ocp4-stig-v2r3-project-config-and-template-resource-quota-1
          # Second benchmark, scanning only. Each entry has its own autoApply and exclude, so this
          # reports while the STIG entry above remediates. Turning autoApply on here applies a
          # further set of MachineConfigs and rolls the nodes again; the two profiles were verified
          # to coexist, but do it as a separate deliberate step.
          - name: nist-moderate-rev4
            profiles:
              - ocp4-moderate-rev-4
              - ocp4-moderate-node-rev-4
              - rhcos4-moderate-rev-4
            scanSetting: default
            autoApply: false
            exclude: []
      uwm:
        # storageClass: 'gp3-csi'            # Omit to use cluster default StorageClass
        prometheus:
          retention: '24h'
          storage: '50Gi'
          # dedicatedServiceMonitors: true
          # resources:
          #   requests:
          #     cpu: '200m'
          #     memory: '1Gi'
          #   limits:
          #     cpu: '1'
          #     memory: '4Gi'
        thanosRuler:
          retention: '24h'
          storage: '10Gi'
          # resources:
          #   requests:
          #     cpu: '100m'
          #     memory: '256Mi'
        alertmanager:
          storage: '10Gi'
      gitlab:
        dbBackupSchedule: '0 2 * * *'
        dbBackupRetention: '30d'
      jfrog:
        dbBackupSchedule: '0 3 * * *'
        dbBackupRetention: '30d'
      # Developer OpenShift GitOps team ArgoCD instances. Team presence + mode
      # come from the gitops-dev-team-<team> labels below; this block supplies
      # each team's ArgoCD RBAC + resource sizing (all fields optional).
      gitops:
        teams:
          dev:
            gitops_rbac_policies:
              - 'g, openshift-systems, role:admin'
              - 'g, openshift-dev-leads, role:admin'
              - 'g, openshift-developers, role:readonly'
          test:
            gitops_rbac_policies:
              - 'g, openshift-systems, role:admin'
      # Advanced Cluster Security Day-2 settings (non-default; defaults cover scanner/collector/auth).
      acs:
        networkPolicies: Enabled
        vmScanning: true
        admissionControl:
      # Ansible Automation Platform instance, applied when the aap label is 'true'.
      aap:
        instance:
          eda:
            disabled: false
      # ===================================================================
      # Workloads deployed from their OWN repositories, as ArgoCD
      # Applications. DATA; the ENABLE flag is the gitops-workloads label.
      #
      # hermes-agent is an agent framework consuming this cluster's MaaS. Its
      # manifests live in its own repo and are NOT vendored here - that is the
      # point of the pointer policy.
      #
      # These coordinates reproduce the Application that was applied by hand
      # before this policy existed. Same name and namespace, so enabling the
      # policy ADOPTS that Application rather than creating a second one.
      gitopsWorkloads:
        gitopsNamespace: openshift-gitops
        workloads:
          - name: hermes-agent
            repoUrl: https://github.com/dmc5179/hermes-openshift
            # NOT main - main has no gitops/ tree and the sync fails with
            # "app path does not exist".
            targetRevision: maas-gitops
            path: gitops/overlays/rhoai-sandbox3587
            destinationNamespace: hermes
            # false on purpose: the overlay carries its own Namespace manifest,
            # so CreateNamespace=true would make Argo and the overlay two
            # writers for one object.
            createNamespace: false
            prune: true
            selfHeal: true
            project: default
            syncOptions:
              - ApplyOutOfSyncOnly=true
            retry:
              limit: 5
              backoff:
                duration: 15s
                factor: 2
                maxDuration: 5m
            ignoreDifferences:
              # Minted out of band; Argo must not fight whoever wrote it.
              - kind: Secret
                name: hermes-maas-credentials
                jsonPointers:
                  - /data
              - kind: PersistentVolumeClaim
                name: hermes-data
                jsonPointers:
                  - /spec/volumeName
                  - /spec/resources/requests/storage
    labels:
      # =====================================================================
      # Profile: minimal RHOAI Models-as-a-Service hub
      # =====================================================================
      # Nine labels are 'true'. That is deliberate. This file previously had
      # 59, and adopting a cluster into this clusterset turned all of them on
      # at once — ACS, AAP, Quay, GitLab, compliance, the full logging and
      # tracing stack, service mesh, dev-hub, dev-spaces, pipelines. On a
      # three-worker cluster that produced 99% CPU requested on every worker,
      # ~270 running pods, and an etcd database at 545 MB against a 4 vCPU /
      # 16 GiB control plane, whose documented baseline is "up to ~250 MiB and
      # low load" (access.redhat.com/articles/7132959).
      #
      # The visible symptom was not "too much is enabled". It was API server
      # timeouts, which crash-looped ovnkube-controller, which left nodes
      # NotReady with no CNI config, which stalled the MachineConfig roll.
      # Nothing in the policy layer reports "overloaded".
      #
      # So: add capability deliberately, one at a time, and watch etcd size
      # and worker CPU requests after each. Turning everything on to see what
      # happens is how you get here.
      #
      # To enable RHOAI Models-as-a-Service, flip these FOUR together — they
      # are one chain and any subset is broken:
      #
      #     openshift-ai: 'true'          # the DataScienceCluster
      #     connectivity-link: 'true'     # Kuadrant/Authorino, the gateway
      #     openshift-ai-maas: 'true'     # the MaaS gateway itself
      #     openshift-ai-models: 'true'   # plus config.openshiftAiModels
      #
      # openshift-ai-maas was previously 'true' while openshift-ai was
      # 'false', which cannot work: the gateway needs the DataScienceCluster.
      # Optional on top: openshift-lightspeed, mcp-gateway.
      #
      # RHOAI is a large install (~75 GB of images). Do not enable it until
      # the control plane has headroom.
      #
      # Left 'true' on purpose, despite being unrelated to MaaS:
      # master-nodes and worker-node-config. They generate KubeletConfigs, and
      # REMOVING a KubeletConfig triggers a full rolling reboot exactly like
      # adding one did. Reverting them costs another cluster-wide roll for no
      # benefit. Leave them unless you want that roll.
      # =====================================================================
      # OpenShift version for cluster deployment and image mirroring
      openshift-version: '4.22.8'
      self-managed: 'true'
      # --- RHOAI Models-as-a-Service -------------------------------------
      # These four move together. Any subset is broken: the gateway needs the
      # DataScienceCluster, and the models need the gateway. Toggle them with
      # scripts/autoshift-feature.sh rather than by hand.
      #
      # openshift-ai-models additionally needs config.openshiftAiModels below.
      # Without it the model list is empty, so the policy applies nothing and
      # reports Compliant — enabled, and silently doing nothing.
      leader-worker-set: 'true'
      connectivity-link: 'true'
      openshift-ai: 'true'
      openshift-ai-subscription-name: rhods-operator
      openshift-ai-channel: stable-3.x
      openshift-ai-source: redhat-operators
      openshift-ai-source-namespace: openshift-marketplace
      openshift-ai-version: ''

      openshift-ai-maas: 'true'
      openshift-ai-models: 'true'
      # Workloads living in their own repos, deployed as ArgoCD Applications.
      # Reads config.gitopsWorkloads above. Enabling this ADOPTS an existing
      # Application of the same name rather than creating a second one.
      gitops-workloads: 'true'
      ### OpenShift Gitops
      gitops: 'true' # is expected to be installed on all hub clusters
      gitops-subscription-name: openshift-gitops-operator
      gitops-disable-default-argocd: 'true'
      gitops-channel: gitops-1.21
      # gitops-version: 'openshift-gitops-operator.v1.21.4'
      gitops-source: redhat-operators
      gitops-source-namespace: openshift-marketplace
      # gitops-namespace: 'openshift-gitops'  # Override ArgoCD namespace per-cluster
      ### AutoShift Console Plugin
      autoshift-console: 'false'  # AutoShift section in the Fleet management perspective
      ### Advanced Cluster Management
      acm-subscription-name: advanced-cluster-management
      # acm-version: 'advanced-cluster-management.v2.17.1'
      acm-channel: release-2.17
      acm-source: redhat-operators
      acm-source-namespace: openshift-marketplace
      acm-availability-config: 'High'
      acm-observability: 'false'
      acm-search-storage: 'false'
      # acm-search-storage-class: 'ocs-storagecluster-ceph-rbd'
      # acm-search-storage-size: '100Gi'
      cluster-install: 'false'
      acm-enable-provisioning: 'false'
      acm-addon-tuning: 'false'
      # config-policy-controller tuning (annotations on ManagedClusterAddOn)
      acm-addon-cpc-eval-concurrency: '5'    # Concurrent policy evaluations (default: 2)
      acm-addon-cpc-client-qps: '75'         # K8s API client QPS (default: 30)
      acm-addon-cpc-client-burst: '100'      # K8s API client burst (default: 45)
      # config-policy-controller resource limits (via AddOnDeploymentConfig)
      acm-addon-cpc-mem-request: '256Mi'
      acm-addon-cpc-cpu-request: '150m'
      acm-addon-cpc-mem-limit: '1Gi'
      # governance-policy-framework tuning (annotations on ManagedClusterAddOn)
      acm-addon-gpf-eval-concurrency: '5'    # Concurrent policy evaluations (default: 2)
      acm-addon-gpf-client-qps: '75'         # K8s API client QPS (default: 30)
      acm-addon-gpf-client-burst: '100'      # K8s API client burst (default: 45)
      # governance-policy-framework resource limits (via AddOnDeploymentConfig).
      # Keep at 1Gi or above: the addon OOMKills around 100 ConfigurationPolicies, and it
      # delivers its own tuning, so it cannot raise the limit once it does.
      acm-addon-gpf-mem-request: '256Mi'
      acm-addon-gpf-cpu-request: '100m'
      acm-addon-gpf-mem-limit: '1Gi'
      ### User Workload Monitoring
      uwm: 'false'
      ### node-maintenance
      node-maintenance: 'false'
      node-maintenance-subscription-name: node-maintenance-operator
      node-maintenance-channel: stable
      node-maintenance-source: redhat-operators
      node-maintenance-source-namespace: openshift-marketplace
      node-maintenance-version: 'node-maintenance-operator.v5.7.1'
      ### Tempo
      tempo: 'false'
      tempo-subscription-name: tempo-product
      tempo-channel: stable
      tempo-source: redhat-operators
      tempo-source-namespace: openshift-marketplace
      # tempo-version: 'tempo-operator.v0.21.0-3'
      ### Kiali
      kiali: 'false'
      kiali-subscription-name: kiali-ossm
      kiali-channel: stable
      kiali-source: redhat-operators
      kiali-source-namespace: openshift-marketplace
      # kiali-version: 'kiali-operator.v2.27.3'
      ### Servicemesh3 Operator
      servicemesh3operator: 'false'
      servicemesh3operator-subscription-name: servicemeshoperator3
      servicemesh3operator-channel: stable
      servicemesh3operator-source: redhat-operators
      servicemesh3operator-source-namespace: openshift-marketplace
      # servicemesh3operator-version: 'servicemeshoperator3.v3.4.1'
      ### Servicemesh3 Ambient
      servicemesh3-ambient: 'false'
      ### OpenTelemetry
      opentelemetry: 'false'
      opentelemetry-subscription-name: opentelemetry-product
      opentelemetry-channel: stable
      opentelemetry-source: redhat-operators
      opentelemetry-source-namespace: openshift-marketplace
      ### external-secrets-operator
      external-secrets-operator: 'false'
      external-secrets-operator-subscription-name: openshift-external-secrets-operator
      external-secrets-operator-channel: stable-v1
      external-secrets-operator-source: redhat-operators
      external-secrets-operator-source-namespace: openshift-marketplace
      ### MetalLB
      metallb: 'false'
      metallb-subscription-name: metallb-operator
      # metallb-version: 'metallb-operator.v4.22.0-202608251608'
      metallb-source: redhat-operators
      metallb-source-namespace: openshift-marketplace
      metallb-channel: stable
      metallb-quota: 'false'
      # Set your quota if metallb-quota is enabled
      metallb-quota-cpu: ''
      metallb-quota-memory:
      # Specify the names of your IPPool files here
      metallb-ippool-1: ''
      #Specify your L2 Advertisement files here
      metallb-l2-1: ''
      # Specify the names of your BGP Advertisement files here
      metallb-bgp-1: ''
      # Specify the names of your Peer files here
      metallb-peer-1: ''
      ### AAP
      aap: 'false'
      aap-subscription-name: ansible-automation-platform-operator
      aap-channel: stable-2.7
      aap-install-plan-approval: Automatic
      aap-source: redhat-operators
      aap-source-namespace: openshift-marketplace
      ### ODF nooBaa Storage - Setting this to true will autocreate a bucket and attach it as hub storage
      aap-noobaa-s3-storage: 'false'
      ### AAP Custom Cert Bundle Injection
      aap-custom-cabundle: 'false'
      #aap-version: 'aap-operator.v2.7.0-0.1787240540'
      ### Master Node Kubelet Configuration
      master-nodes: 'true'
      master-max-pods: '250'
      master-system-reserved-memory: '3Gi'
      master-system-reserved-cpu: '500m'
      master-kube-reserved-memory: '1536Mi'
      master-kube-reserved-cpu: '500m'
      ### Infrastructure Nodes
      # Blank = not managed. Dedicated infra nodes are three more instances, and on a cluster
      # installed into a pre-existing VPC the AWS node policies cannot provision them at all:
      # they rebuild the subnet reference as a tag:Name filter from the infrastructure ID, which
      # matches nothing when the VPC was not created by the installer. See
      # https://github.com/auto-shift/autoshiftv2/issues/282. Set this only on a cluster whose
      # VPC the installer owns, and that is big enough to want the separation.
      infra-nodes: ''
      infra-nodes-provider: aws
      infra-nodes-instance-type: 'm5.2xlarge'
      infra-nodes-numcpu: ''
      infra-nodes-memory-mib: ''
      infra-nodes-numcores-per-socket: ''
      infra-nodes-zone-1: ''
      infra-machineconfigpool: 'false'
      infra-node-config: 'false'
      infra-system-reserved-memory: '2Gi'
      infra-system-reserved-cpu: '500m'
      infra-kube-reserved-memory: '1Gi'
      infra-kube-reserved-cpu: '500m'
      ### Worker Nodes
      worker-nodes: ''
      worker-nodes-numcpu: ''
      worker-nodes-memory-mib: ''
      worker-nodes-numcores-per-socket: ''
      worker-nodes-zone-1: ''
      worker-node-config: 'true'
      worker-max-pods: '250'
      worker-system-reserved-memory: '1Gi'
      worker-system-reserved-cpu: '250m'
      worker-kube-reserved-memory: '512Mi'
      worker-kube-reserved-cpu: '250m'
      ### Storage Nodes
      # Blank = not managed, which is the default the other clustersets use
      # (hub1, hub2, hubofhubs, managed, sbx). A blank value is not stamped onto
      # the ManagedCluster at all, so the placement's Exists predicate fails and
      # the policy deselects cleanly - it is a real off switch, not an empty
      # replica count. Only set this if you want OpenShift Data Foundation; the
      # nodes exist to carry it.
      storage-nodes: ''
      # storage-nodes-zone-1: 'us-east-2a'
      # storage-nodes-zone-2: 'us-east-2b'
      # storage-nodes-zone-3: 'us-east-2c'
      # storage-nodes-region: 'us-east-2'
      storage-nodes-instance-type: 'm6in.8xlarge'
      storage-nodes-provider: aws
      # storage-nodes-node-[iterator]: node-1 # For use with baremetal
      # storage-nodes-node-[iterator]: node-2 # For use with baremetal
      storage-nodes-numcpu: ''
      storage-nodes-memory-mib: ''
      storage-nodes-numcores-per-socket: ''
      ### Machine Health Checks
      machine-health-checks: 'false'
      machine-health-checks-worker: 'false'
      machine-health-checks-infra: 'false'
      machine-health-checks-storage: 'false'
      ### LVM Operator
      lvm: 'false'
      lvm-subscription-name: lvms-operator
      # lvm-version: 'lvms-operator.v4.18.0-202410091522'
      lvm-default: 'false'
      lvm-fstype: xfs
      lvm-size-percent: 90
      lvm-overprovision-ratio: 10
      lvm-channel: stable-4.22
      lvm-source: redhat-operators
      lvm-source-namespace: openshift-marketplace
      ### Local Storage Operator
      local-storage: 'false'
      local-storage-subscription-name: local-storage-operator
      # local-storage-version: 'local-storage-operator.v4.22.0-202608251608'
      local-storage-channel: stable
      local-storage-source: redhat-operators
      local-storage-source-namespace: openshift-marketplace
      ### OpenShift Data Foundation
      # Off by default. ODF is a deliberate, expensive opt-in: the settings
      # below ask for 2Ti x 2 devices x 3 replicas on dedicated m6in.8xlarge
      # storage nodes. Turning it on means also setting storage-nodes above.
      odf: 'false'
      odf-subscription-name: odf-operator
      # odf-version: 'odf-operator.v4.22.2-rhodf'
      odf-multi-cloud-gateway: standard
      odf-noobaa-pvpool: ''
      odf-noobaa-store-size: ''
      odf-noobaa-store-num-volumes: ''
      odf-ocs-storage-class-name: 'gp3-csi'
      odf-ocs-storage-size: '2Ti'
      odf-ocs-storage-count: '2'
      odf-ocs-storage-replicas: '3'
      odf-resource-profile: balanced
      odf-channel: stable-4.22
      odf-source: redhat-operators
      odf-source-namespace: openshift-marketplace
      odf-default-storageclass: ocs-storagecluster-ceph-rbd
      odf-csi-all-nodes: 'false'  # 'true' to run CSI plugins on all nodes (masters, infra, storage)
      ### OpenShift Internal Registry
      imageregistry: 'false'
      imageregistry-management-state: Managed
      imageregistry-replicas: '3'
      imageregistry-storage-type: s3 # pvc
      imageregistry-s3-region: us-east-2
      imageregistry-pvc-access-mode: ReadWriteMany
      imageregistry-pvc-size: 100Gi
      imageregistry-pvc-storage-class: ocs-storagecluster-ceph-rbd
      imageregistry-pvc-volume-mode: Block
      imageregistry-rollout-strategy: RollingUpdate
      ### Kubernetes NMState Operator
      nmstate: 'false'
      nmstate-subscription-name: kubernetes-nmstate-operator
      # nmstate-version: 'kubernetes-nmstate-operator.4.22.0-202608260901'
      # See _example.yaml for full nmstate label reference
      ### Advanced Cluster Security
      acs: 'false'
      acs-default-policies: 'false'  # baseline SecurityPolicy resources (was config.acs.defaultPolicies)
      acs-subscription-name: rhacs-operator
      # acs-version: 'rhacs-operator.v4.11.3'
      acs-channel: stable
      acs-source: redhat-operators
      acs-source-namespace: openshift-marketplace
      ### Developer Spaces
      dev-spaces: 'false'
      dev-spaces-subscription-name: devspaces
      # dev-spaces-version: 'devspacesoperator.v3.30.0'
      dev-spaces-channel: stable
      dev-spaces-source: redhat-operators
      dev-spaces-source-namespace: openshift-marketplace
      ### Developer Hub
      dev-hub: 'false'
      dev-hub-subscription-name: rhdh
      # dev-hub-version: 'rhdh-operator.v1.10.4'
      dev-hub-channel: fast-1.10
      dev-hub-source: redhat-operators
      dev-hub-source-namespace: openshift-marketplace
      ### OpenShift Pipelines
      pipelines: 'false'
      pipelines-subscription-name: openshift-pipelines-operator-rh
      # pipelines-version: 'openshift-pipelines-operator-rh.v1.23.2'
      pipelines-channel: pipelines-1.23
      pipelines-source: redhat-operators
      pipelines-source-namespace: openshift-marketplace
      ### Trusted Artifact Signer
      tas: 'false'
      tas-subscription-name: rhtas-operator
      # tas-version: 'rhtas-operator.v1.4.3'
      tas-channel:  stable
      tas-source: redhat-operators
      tas-source-namespace: openshift-marketplace
      ### Quay
      quay: 'false'
      quay-subscription-name: quay-operator
      # quay-version: 'quay-operator.v3.18.0'
      quay-channel: stable-3.18
      quay-source: redhat-operators
      quay-source-namespace: openshift-marketplace
      ### Developer OpenShift Gitops
      gitops-dev: 'false'
      gitops-dev-team-test-cluster-scoped: 'false'
      gitops-dev-team-test: 'hub' #hub or standalone
      # gitops-dev-team-{INSERT_TEAM_NAME}
      ### Loki
      loki: 'false'
      loki-subscription-name: loki-operator
      # loki-version: 'loki-operator.v6.6.0'
      loki-channel: stable-6.6
      loki-source: redhat-operators
      loki-source-namespace: openshift-marketplace
      loki-size: 1x.extra-small
      loki-storageclass: gp3-csi
      loki-lokistack-name: logging-lokistack
      ### OpenShift Logging
      logging: 'false'
      logging-subscription-name: cluster-logging
      # logging-version: 'cluster-logging.v6.6.0'
      logging-channel: stable-6.6
      logging-source: redhat-operators
      logging-source-namespace: openshift-marketplace
      ### Cluster Observability Operator
      coo: 'false'
      coo-subscription-name: cluster-observability-operator
      # coo-version: 'cluster-observability-operator.v1.5.2'
      coo-channel: stable
      coo-source: redhat-operators
      coo-source-namespace: openshift-marketplace
      ### Compliance Operator Stig Apply
      manual-remediations: 'false'
      # Opt into individual members. The set gate above plus one of these places a policy;
      # anything not listed here is not deployed at all rather than deployed and inert.
      manual-remediations-classification-banner: 'false'
      manual-remediations-motd: 'false'
      manual-remediations-remove-samples-operator: 'false'
      manual-remediations-route-rate-limits: 'false'
      manual-remediations-quota-guard: 'false'
      manual-remediations-project-template: 'false'
      compliance: 'false'
      compliance-auto-remediate: 'false'
      compliance-subscription-name: compliance-operator
      compliance-source: redhat-operators
      compliance-source-namespace: openshift-marketplace
      compliance-channel: stable
      ### OpenShift Virtualization
      virt: 'false'
      virt-channel: stable
      virt-subscription-name: kubevirt-hyperconverged
      virt-source: redhat-operators
      virt-source-namespace: openshift-marketplace
      ### Disconnected Mirror Settings
      ### Disconnected Mirror Settings (testing - points to real registry)
      disconnected-mirror: 'false'
      #mirror-registry-host: 'registry.redhat.io'
      # Suffix appended to catalog source names for mirrored catalogs
      # Example: redhat-operators + -mirror = redhat-operators-mirror
      mirror-catalog-suffix: 'mirror'
      ### Migration Toolkit for Openshift Virtualization
      mtv: 'false'
      mtv-subscription-name: mtv-operator
      mtv-channel: release-v2.12
      mtv-source: redhat-operators
      mtv-source-namespace: openshift-marketplace
      # mtv-version: 'mtv-operator.v2.12.7'
      ### nvidia-gpu-operator
      # Needs node-feature-discovery below: the GPU operator keys its driver
      # DaemonSets off the PCI labels NFD applies, so on its own it installs and
      # then does nothing. A GPU node with no driver stack looks completely
      # healthy - Ready, schedulable - while reporting no nvidia.com/gpu
      # capacity, so GPU pods just sit Pending.
      nvidia-gpu-operator: 'true'
      nvidia-gpu-operator-subscription-name: gpu-operator-certified
      nvidia-gpu-operator-channel: v25.3
      nvidia-gpu-operator-source: certified-operators
      nvidia-gpu-operator-source-namespace: openshift-marketplace
      ### node-feature-discovery
      node-feature-discovery: 'true'
      node-feature-discovery-subscription-name: nfd
      node-feature-discovery-channel: stable
      node-feature-discovery-source: redhat-operators
      node-feature-discovery-source-namespace: openshift-marketplace
      # node-feature-discovery-version: 'nfd.4.22.0-202608251608'
      ### gitlab
      gitlab: 'false'
      gitlab-subscription-name: gitlab-operator-kubernetes
      gitlab-channel: stable
      gitlab-source: certified-operators
      gitlab-source-namespace: openshift-marketplace
      # gitlab-db-mode: 'managed'              # managed (default), external, or bundled
      # gitlab-redis-mode: 'managed'           # managed (default), external, or bundled
      # gitlab-object-storage-mode: 'managed'  # managed (default), external, or bundled
      gitlab-db-instances: '2'
      gitlab-db-pooler-instances: '2'
      gitlab-db-backups: 'false'
      gitlab-gitaly-ha: 'false'
      gitlab-praefect-replicas: '3'
      gitlab-gitaly-replicas: '3'
      gitlab-gitaly-storage-class: 'ocs-storagecluster-cephfs'
      gitlab-redis-storage-class: 'ocs-storagecluster-cephfs'
      gitlab-webservice-min-replicas: '2'
      gitlab-webservice-max-replicas: '4'
      gitlab-sidekiq-min-replicas: '2'
      gitlab-sidekiq-max-replicas: '4'
      gitlab-shell-min-replicas: '2'
      gitlab-shell-max-replicas: '4'
      ### gitlab-runner
      gitlab-runner: 'false'  # Disabled: v1.47.0 has broken kube-rbac-proxy image on registry.gitlab.com
      gitlab-runner-subscription-name: gitlab-runner-operator
      gitlab-runner-channel: stable
      gitlab-runner-source: certified-operators
      gitlab-runner-source-namespace: openshift-marketplace
      ### cert-manager
      cert-manager: 'true'
      cert-manager-subscription-name: openshift-cert-manager-operator
      cert-manager-channel: stable-v1
      cert-manager-source: redhat-operators
      cert-manager-source-namespace: openshift-marketplace
      ### jfrog
      jfrog: 'false'
      jfrog-subscription-name: openshiftartifactoryha-operator
      jfrog-channel: alpha
      jfrog-source: certified-operators
      jfrog-source-namespace: openshift-marketplace
      jfrog-db-instances: '2'
      jfrog-db-pooler-instances: '2'
      jfrog-node-replicas: '2'
      artifactory-db-backups: 'false'
      ### cloudnative-pg
      cloudnative-pg: 'false'
      cloudnative-pg-subscription-name: cloudnative-pg
      cloudnative-pg-channel: stable-v1
      cloudnative-pg-source: certified-operators
      cloudnative-pg-source-namespace: openshift-marketplace
