# Spoke-side objects policy-openshell-prereqs reads on the managed cluster. Each one is the state of
# a cluster that is ready for OpenShell, so the barrier resolves to its assertion rather than to one
# of its fail calls.
#
# The Sandbox CRD as the Red Hat build of Agent Sandbox serves it: agents.x-k8s.io, v1beta1 served.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.agents.x-k8s.io
spec:
  group: agents.x-k8s.io
  names:
    kind: Sandbox
    plural: sandboxes
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
status:
  conditions:
    - type: Established
      status: 'True'
---
# cert-manager's Certificate CRD, present once the cert-manager Operator is installed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Certificate
    plural: certificates
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
---
# A default StorageClass, for the gateway's SQLite PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: stub-default
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
provisioner: example.com/stub
