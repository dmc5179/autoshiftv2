# Does RHOKP search return documents?
#
# inform-only. The enforcing policy goes Compliant as soon as the Deployment matches its template.
# Available here means more than a running pod: the readiness probe passes only when the portal
# core, the one the MCP server queries, holds documents (see manifests/rhokp-server.yaml). A pod
# with a missing or invalid key serves its web UI and stays unready, so this stays NonCompliant.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- if not $raw hub}}{{hub fail "rhokp-mcp: the rendered-config ConfigMap for this cluster is missing" hub}}{{hub- end hub}}
  {{hub- $c := (index ($raw | fromYaml | default dict) "rhokpMcp" | default dict) hub}}
  {{hub- $ns := (dig "namespace" "rhokp" $c) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rhokp-server
        namespace: '{{hub $ns hub}}'
      status:
        availableReplicas: 1
