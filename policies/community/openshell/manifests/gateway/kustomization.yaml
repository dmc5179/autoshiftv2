apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything the chart renders EXCEPT the gateway StatefulSet, enforced musthave (the policy
# default). musthave merges and never removes, which suits objects that controllers and the API
# server annotate after creation: the certgen Job carries controller-added labels and an immutable
# template, so mustonlyhave there would stay NonCompliant forever.
#
# The StatefulSet is ../statefulset. The render itself, and every value and patch, is ../chart.
resources:
  - ../chart
patches:
  - target:
      annotationSelector: autoshift-openshell/manifest=statefulset
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: selected-by-target
