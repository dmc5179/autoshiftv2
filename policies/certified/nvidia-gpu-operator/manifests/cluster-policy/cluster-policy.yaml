# The GPU stack itself: driver, container toolkit, device plugin, DCGM and
# feature discovery. Without this the operator installs but no node ever
# advertises nvidia.com/gpu, and anything scheduling on GPUs stays Pending.
#
# use_ocp_driver_toolkit lets the driver build against the running RHCOS
# release rather than a pinned kernel, which is what makes it survive
# cluster upgrades.
#
# Every field here must exist in the ClusterPolicy CRD that the channel in
# manifests/operator-install/kustomization.yaml installs. The API server
# rejects the whole object on the first unknown field, with
# `strict decoding error: unknown field "spec.<x>"`, and the policy then
# reports the CR as "missing, and cannot be created" — which reads like a
# permissions or ordering problem rather than a schema mismatch.
#
# Removed because v25.3 does not define them: spec.cdi.nriPluginEnabled,
# spec.sandboxWorkloads.mode, spec.driver.licensingConfig.secretName,
# spec.mps, spec.kataSandboxDevicePlugin. All five were set to a default or
# sat under a disabled feature, so nothing changes behaviourally.
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  operator:
    use_ocp_driver_toolkit: true
  cdi:
    enabled: false
  sandboxWorkloads:
    enabled: false
    defaultWorkload: container
  driver:
    enabled: true
    useNvidiaDriverCRD: false
    kernelModuleType: auto
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: false
        enable: false
        force: false
        timeoutSeconds: 300
      maxParallelUpgrades: 1
      maxUnavailable: 25%
      podDeletion:
        deleteEmptyDir: false
        force: false
        timeoutSeconds: 300
      waitForCompletion:
        timeoutSeconds: 0
    repoConfig:
      configMapName: ''
    certConfig:
      name: ''
    licensingConfig:
      nlsEnabled: true
    virtualTopology:
      config: ''
    kernelModuleConfig:
      name: ''
  dcgmExporter:
    enabled: true
    config:
      name: ''
    serviceMonitor:
      enabled: true
  dcgm:
    enabled: true
  daemonsets:
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: '1'
  devicePlugin:
    enabled: true
    config:
      name: ''
      default: ''
  gfd:
    enabled: true
  migManager:
    enabled: true
  nodeStatusExporter:
    enabled: true
  mig:
    strategy: single
  toolkit:
    enabled: true
  validator:
    plugin:
      env: []
  vgpuManager:
    enabled: false
  vgpuDeviceManager:
    enabled: true
  sandboxDevicePlugin:
    enabled: true
  vfioManager:
    enabled: true
  ccManager:
    enabled: true
  gds:
    enabled: false
  gdrcopy:
    enabled: false
