# Did OVN actually program the rules?
#
# inform-only, and worth having because an EgressFirewall object can exist and be
# unenforced. If OVN rejects a rule the object is still there and the policy that
# created it still reports Compliant — the only signal is status.status, which
# reads "EgressFirewall Rules applied" when the rules are live.
#
# Only asserted for zones that actually configure firewall rules, so a zone using
# NetworkPolicy alone does not report a false failure.
object-templates-raw: |
  {{hub- $policyNs := .PolicyMetadata.namespace hub}}
  {{hub- $rcm := (lookup "v1" "ConfigMap" $policyNs (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $cfg := (dig "modelEgress" (dict) ((dig "data" "config" "" $rcm) | fromYaml | default dict)) hub}}
  {{hub- range $z := (dig "zones" (list) $cfg) hub}}
  {{hub- if (dig "egressFirewall" (list) $z) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: k8s.ovn.org/v1
      kind: EgressFirewall
      metadata:
        name: default
        namespace: {{hub (dig "namespace" "" $z) hub}}
      status:
        status: EgressFirewall Rules applied
  {{hub- end hub}}
  {{hub- end hub}}
