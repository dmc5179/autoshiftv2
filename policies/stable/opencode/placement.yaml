apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-opencode
  namespace: ${POLICY_NAMESPACE}
spec:
  # No spec.clusterSets: selects across all ManagedClusterSetBindings in this namespace,
  # filtered by the predicate below. Both labels must be 'true': the sample is useless without
  # Dev Spaces, and the policy writes into openshift-devspaces.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/opencode'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/dev-spaces'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
