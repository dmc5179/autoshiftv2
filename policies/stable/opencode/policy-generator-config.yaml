apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: opencode
# Per-deployment scalars (${...}) are substituted by the repo-server CMP (envsubst/sed) BEFORE
# `kustomize build` runs. They live here and in placement.yaml, never in manifests/, whose hub
# templates contain `$vars` that substitution would clobber.
#
# devfile/ is not a manifest directory: users' workspaces fetch devfile/devfile.yaml by its raw
# Git URL, and nothing here renders it.
placementBindingDefaults:
  name: binding-policy-opencode
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: medium
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  placement:
    placementPath: placement.yaml
policies:
  # The dashboard sample, the MaaS URL and model for every workspace, and the ingress CA in the
  # workspace trust bundle. Waits for Dev Spaces to report Active, because the operator only
  # picks up these labelled ConfigMaps once it is running.
  - name: policy-opencode-samples
    dependencies:
      - name: policy-devspaces-ready-test
    manifests:
      - path: manifests/opencode-samples.yaml
    customMessage:
      noncompliant: >-
        {{ regexReplaceAll "(?s).*error calling fail: " .DefaultMessage "" | trim }}
