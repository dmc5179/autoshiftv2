apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: sandboxed-containers
placementBindingDefaults:
  name: binding-policy-sandboxed-containers
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  placement:
    placementPath: placement.yaml
policies:
  - name: policy-sandboxed-containers-operator-install
    manifests:
      - path: manifests/operator-install
  - name: policy-sandboxed-containers-tdx-mc
    dependencies:
      - name: policy-sandboxed-containers-operator-install
    manifests:
      - path: manifests/tdx-machine-config
  - name: policy-sandboxed-containers-coco-config
    dependencies:
      - name: policy-sandboxed-containers-tdx-mc
    manifests:
      - path: manifests/coco-config
