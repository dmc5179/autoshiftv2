apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gitops-workloads
  namespace: ${POLICY_NAMESPACE}
spec:
  # No cluster-type predicate. The scaffolder emits cluster-type: spoke, which
  # never matches a self-managed hub, and the policy then has no status at all
  # rather than reporting a failure. The enablement label is the only gate.
  #
  # No -provider predicate either: an ArgoCD Application is platform-agnostic.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/gitops-workloads'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
