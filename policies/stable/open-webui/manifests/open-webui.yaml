# Open WebUI as the chat front end for the hermes-agent policy's Hermes Agent.
#
# Configuration is config.openWebui; every key is optional. It also reads config.hermesAgent,
# because it connects to that Hermes: in-cluster, at hermes-agent.<namespace>.svc:8642, never
# through a Route.
#
# Sign-in, config.openWebui.auth:
#   local      Open WebUI's own accounts. The administrator comes from adminEmail and a password
#              Secret an administrator creates.
#   openshift  OpenShift credentials, through an oauth-proxy sidecar. Only members of
#              allowedGroups get in; the proxy checks that with a SubjectAccessReview against the
#              user's own token, so its ServiceAccount needs no cluster-wide permissions. The
#              proxy passes the user to Open WebUI in trusted headers, so Open WebUI listens on
#              127.0.0.1 only: anything that reached its port directly could forge them.
#
# Credentials, none of which come from git:
#   - the key it presents to Hermes is copied on the managed cluster from the hermes-api-key
#     Secret, which the Hermes pod generates on first start;
#   - its own session-signing key is generated by the image on first start and kept on the PVC,
#     through WEBUI_SECRET_KEY_FILE;
#   - local: the administrator password comes from a Secret an administrator creates;
#   - openshift: the proxy's cookie secret is generated at pod start, and the administrator
#     account, which signs in through OpenShift, gets a random password nobody ever needs.
#
# OpenShift notes, each reproduced under an arbitrary UID before it was fixed:
#   - the image is built to run as root with HOME=/root (mode 700), so HOME is moved to /tmp;
#   - about 265 MB of embedding and speech models ship under /app/backend/data, which the PVC
#     mount hides, so seed-models copies them onto the PVC once instead of every first start
#     downloading them from HuggingFace (or failing to, on a disconnected cluster).
#
# Most settings below are read by Open WebUI only on its FIRST start and then stored in its
# database, where the Admin Panel owns them. Changing them here later changes nothing.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- $cfg := ($raw | fromYaml | default dict) hub}}
  {{hub- $o := (index $cfg "openWebui" | default dict) hub}}
  {{hub- $h := (index $cfg "hermesAgent" | default dict) hub}}
  {{hub- if not (dig "model" "" $h) hub}}{{hub fail "open-webui: config.hermesAgent is required; Open WebUI connects to the Hermes the hermes-agent policy deploys" hub}}{{hub- end hub}}
  {{hub- $ns := (dig "namespace" "open-webui" $o) hub}}
  {{hub- $hns := (dig "namespace" "hermes" $h) hub}}
  {{hub- $image := (dig "image" "ghcr.io/open-webui/open-webui@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded" $o) hub}}
  {{hub- $size := (dig "storageSize" "10Gi" $o) hub}}
  {{hub- $sc := (dig "storageClass" "" $o) hub}}
  {{hub- $routeHost := (dig "routeHost" "" $o) hub}}
  {{hub- $adminEmail := (dig "adminEmail" "" $o) hub}}
  {{hub- $adminSecret := (dig "adminSecretRef" "name" "open-webui-admin" $o) hub}}
  {{hub- $adminKey := (dig "adminSecretRef" "key" "password" $o) hub}}
  {{hub- $auth := (dig "auth" "local" $o) hub}}
  {{hub- if not (has $auth (list "local" "openshift")) hub}}{{hub fail (printf "open-webui: config.openWebui.auth %s must be local or openshift" $auth) hub}}{{hub- end hub}}
  {{hub- $openshift := eq $auth "openshift" hub}}
  {{hub- $groups := (dig "allowedGroups" (list "maas-users") $o) hub}}
  {{hub- if and $openshift (not $groups) hub}}{{hub fail "open-webui: config.openWebui.allowedGroups must name at least one group when auth is openshift" hub}}{{hub- end hub}}
  {{hub- $proxyImageCfg := (dig "proxyImage" "" $o) hub}}
  {{- $host := "{{hub $routeHost hub}}" }}
  {{- if not $host }}
  {{- $domain := (dig "spec" "domain" "" ((lookup "config.openshift.io/v1" "Ingress" "" "cluster") | default dict)) }}
  {{- if not $domain }}{{ fail "open-webui: cannot read spec.domain from ingresses.config.openshift.io/cluster; set config.openWebui.routeHost" }}{{- end }}
  {{- $host = (printf "%s.%s" "{{hub $ns hub}}" $domain) }}
  {{- end }}
  {{- $hermesKey := (fromSecret "{{hub $hns hub}}" "hermes-api-key" "API_SERVER_KEY") }}
  {{- if not $hermesKey }}{{ fail "open-webui: Secret {{hub $hns hub}}/hermes-api-key does not exist yet. The Hermes pod creates it on first start; check policy-hermes-agent-ready" }}{{- end }}
  {{hub- if $openshift hub}}
  # The cluster's own oauth-proxy, from the release payload, so it matches the cluster version and
  # a disconnected mirror of the release already carries it.
  {{- $proxyImage := "{{hub $proxyImageCfg hub}}" }}
  {{- if not $proxyImage }}
  {{- $is := (lookup "image.openshift.io/v1" "ImageStream" "openshift" "oauth-proxy") | default dict }}
  {{- range $t := (dig "status" "tags" (list) $is) }}
  {{- if and (not $proxyImage) (eq (dig "tag" "" $t) "v4.4") (dig "items" (list) $t) }}{{- $proxyImage = (dig "dockerImageReference" "" (index (dig "items" (list) $t) 0)) }}{{- end }}
  {{- end }}
  {{- if not $proxyImage }}{{ fail "open-webui: cannot resolve the oauth-proxy image from ImageStream openshift/oauth-proxy tag v4.4; set config.openWebui.proxyImage" }}{{- end }}
  {{- end }}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{hub $ns hub}}'
        labels:
          app.kubernetes.io/name: open-webui
  # Hermes' API_SERVER_KEY, copied across namespaces on the managed cluster. Hermes never rotates
  # it, which matters: Open WebUI stores the key in its database on first start and ignores this
  # Secret after that.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: open-webui-hermes
        namespace: '{{hub $ns hub}}'
      type: Opaque
      data:
        OPENAI_API_KEY: '{{ $hermesKey }}'
  # Users, chats, settings, uploads, the vector store and the seeded models, in SQLite.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: open-webui-data
        namespace: '{{hub $ns hub}}'
        labels:
          app.kubernetes.io/name: open-webui
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: '{{hub $size hub}}'
        {{hub- if $sc hub}}
        storageClassName: '{{hub $sc hub}}'
        {{hub- end hub}}
  {{hub- if $openshift hub}}
  # The proxy's OAuth client identity. The redirect reference lets OpenShift accept the Route as
  # the OAuth callback, so no OAuthClient object is needed.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: open-webui-proxy
        namespace: '{{hub $ns hub}}'
        annotations:
          serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind": "OAuthRedirectReference", "apiVersion": "v1", "reference": {"kind": "Route", "name": "open-webui"} }'
  # Who may sign in. The proxy runs a SubjectAccessReview for get on this Service, with the user's
  # own token, so granting that verb to a group is what lets its members in.
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: open-webui-login
        namespace: '{{hub $ns hub}}'
      rules:
        - apiGroups:
            - ''
          resources:
            - services
          resourceNames:
            - open-webui-proxy
          verbs:
            - get
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: open-webui-login
        namespace: '{{hub $ns hub}}'
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: open-webui-login
      subjects:
        {{hub- range $g := $groups hub}}
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: '{{hub $g hub}}'
        {{hub- end hub}}
  {{hub- end hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-webui
        namespace: '{{hub $ns hub}}'
        labels:
          app.kubernetes.io/name: open-webui
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app.kubernetes.io/name: open-webui
        template:
          metadata:
            labels:
              app.kubernetes.io/name: open-webui
          spec:
            {{hub- if $openshift hub}}
            serviceAccountName: open-webui-proxy
            {{hub- end hub}}
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            initContainers:
              # Copies each baked cache once, through a temporary directory and a rename, so an
              # interrupted copy is retried rather than left half done.
              - name: seed-models
                image: '{{hub $image hub}}'
                imagePullPolicy: IfNotPresent
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -eu
                    for sub in embedding whisper tiktoken; do
                      src=/app/backend/data/cache/$sub
                      dst=/data/cache/$sub
                      [ -d "$src" ] || continue
                      if [ -d "$dst" ]; then echo "cache/$sub already present"; continue; fi
                      mkdir -p /data/cache
                      rm -rf "$dst.seeding"
                      cp -R "$src" "$dst.seeding"
                      chmod -R g=u "$dst.seeding"
                      mv "$dst.seeding" "$dst"
                      echo "seeded cache/$sub"
                    done
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                volumeMounts:
                  - name: data
                    mountPath: /data
              {{hub- if $openshift hub}}
              # The proxy encrypts its session cookie with this. RHACM templates cannot generate a
              # random value, so it is made here at every start; a restart signs users out of the
              # proxy, and they get straight back in through their existing OpenShift session.
              - name: proxy-cookie-secret
                image: '{{hub $image hub}}'
                imagePullPolicy: IfNotPresent
                command:
                  - /bin/sh
                  - -c
                  - tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > /cookie/secret
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    cpu: 100m
                    memory: 32Mi
                volumeMounts:
                  - name: proxy-cookie
                    mountPath: /cookie
              {{hub- end hub}}
            containers:
              - name: open-webui
                image: '{{hub $image hub}}'
                imagePullPolicy: IfNotPresent
                {{hub- if and $openshift $adminEmail hub}}
                # The administrator signs in through OpenShift, as the account whose email is
                # adminEmail, so its password is never used. Open WebUI still needs one to create
                # the account, so a random one is made here and kept nowhere.
                command:
                  - /bin/bash
                  - -c
                  - export WEBUI_ADMIN_PASSWORD="$(head -c 32 /dev/urandom | base64)"; exec bash /app/backend/start.sh
                {{hub- end hub}}
                env:
                  # The connection to Hermes. Model id is always hermes-agent.
                  - name: OPENAI_API_BASE_URL
                    value: 'http://hermes-agent.{{hub $hns hub}}.svc.cluster.local:8642/v1'
                  - name: OPENAI_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: open-webui-hermes
                        key: OPENAI_API_KEY
                  - name: ENABLE_OPENAI_API
                    value: 'true'
                  - name: ENABLE_OLLAMA_API
                    value: 'false'
                  - name: DEFAULT_MODELS
                    value: hermes-agent
                  # Background tasks off. Each is a full Hermes agent turn of about 14k prompt
                  # tokens, and Hermes treats the prompt as a real request: it may act on it with
                  # tools and will write it to memory.
                  - name: ENABLE_TITLE_GENERATION
                    value: 'false'
                  - name: ENABLE_TAGS_GENERATION
                    value: 'false'
                  - name: ENABLE_FOLLOW_UP_GENERATION
                    value: 'false'
                  - name: ENABLE_SEARCH_QUERY_GENERATION
                    value: 'false'
                  - name: ENABLE_RETRIEVAL_QUERY_GENERATION
                    value: 'false'
                  - name: ENABLE_AUTOCOMPLETE_GENERATION
                    value: 'false'
                  # No calls out of the cluster that nobody asked for: no polling GitHub for
                  # releases, and no button that publishes a chat to openwebui.com.
                  - name: ENABLE_VERSION_UPDATE_CHECK
                    value: 'false'
                  - name: ENABLE_COMMUNITY_SHARING
                    value: 'false'
                  # Every user who can sign in sees every model. Without this Open WebUI shows a
                  # connection's models to administrators only, until one grants access model by
                  # model, and a new user finds an empty model list. Who can sign in is already
                  # decided by allowedGroups, or by the administrator with auth local.
                  - name: BYPASS_MODEL_ACCESS_CONTROL
                    value: 'true'
                  # The models are seeded from the image; do not ask HuggingFace for updates.
                  - name: RAG_EMBEDDING_MODEL_AUTO_UPDATE
                    value: 'false'
                  - name: RAG_RERANKING_MODEL_AUTO_UPDATE
                    value: 'false'
                  - name: HOME
                    value: /tmp
                  # Generated by the image on first start and kept on the PVC, so sessions survive
                  # restarts and the key never leaves the cluster.
                  - name: WEBUI_SECRET_KEY_FILE
                    value: /app/backend/data/.webui_secret_key
                  - name: WEBUI_URL
                    value: 'https://{{ $host }}'
                  - name: CORS_ALLOW_ORIGIN
                    value: 'https://{{ $host }}'
                  {{hub- if $openshift hub}}
                  # Reachable only from the proxy in this pod: Open WebUI trusts the headers below,
                  # so nothing else may reach its port.
                  - name: HOST
                    value: 127.0.0.1
                  # The proxy names the user. An OpenShift user without an email address becomes
                  # <username>@cluster.local; a user named like an address keeps that name.
                  - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
                    value: X-Forwarded-Email
                  - name: WEBUI_AUTH_TRUSTED_NAME_HEADER
                    value: X-Forwarded-User
                  # allowedGroups already decides who gets in, so a new user starts as a user
                  # rather than waiting in pending for an administrator.
                  - name: DEFAULT_USER_ROLE
                    value: user
                  {{hub- end hub}}
                  {{hub- if $adminEmail hub}}
                  # Open WebUI creates this administrator at first start, and only while no user
                  # exists.
                  - name: WEBUI_ADMIN_EMAIL
                    value: '{{hub $adminEmail hub}}'
                  {{hub- if not $openshift hub}}
                  # Without the Secret the pod does not start, so the site is never reachable
                  # before its administrator exists.
                  - name: WEBUI_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: '{{hub $adminSecret hub}}'
                        key: '{{hub $adminKey hub}}'
                  {{hub- end hub}}
                  {{hub- end hub}}
                ports:
                  - name: http
                    containerPort: 8080
                    protocol: TCP
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                {{hub- if $openshift hub}}
                # Exec probes: Open WebUI listens on 127.0.0.1, which the kubelet cannot reach.
                startupProbe:
                  exec:
                    command:
                      - curl
                      - -sf
                      - -o
                      - /dev/null
                      - http://127.0.0.1:8080/health
                  periodSeconds: 10
                  failureThreshold: 60
                  timeoutSeconds: 5
                readinessProbe:
                  exec:
                    command:
                      - curl
                      - -sf
                      - -o
                      - /dev/null
                      - http://127.0.0.1:8080/health
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                livenessProbe:
                  exec:
                    command:
                      - curl
                      - -sf
                      - -o
                      - /dev/null
                      - http://127.0.0.1:8080/health
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                {{hub- else hub}}
                # First start runs database migrations and loads the embedding model.
                startupProbe:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  failureThreshold: 60
                  timeoutSeconds: 5
                readinessProbe:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                livenessProbe:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                {{hub- end hub}}
                resources:
                  requests:
                    cpu: 250m
                    memory: 1Gi
                  limits:
                    cpu: '2'
                    memory: 4Gi
                volumeMounts:
                  - name: data
                    mountPath: /app/backend/data
                  - name: tmp
                    mountPath: /tmp
              {{hub- if $openshift hub}}
              # Signs users in with OpenShift and admits only those allowed to get the
              # open-webui-proxy Service. Three defaults are overridden on purpose:
              #   --upstream-timeout   30s would cut off a Hermes agent turn that runs tools;
              #   --pass-basic-auth    true would overwrite the Authorization header that Open
              #                        WebUI's own API calls carry;
              #   --http-address       blank, so the proxy serves only TLS.
              - name: oauth-proxy
                image: '{{ $proxyImage }}'
                imagePullPolicy: IfNotPresent
                args:
                  - --provider=openshift
                  - --https-address=:8443
                  - --http-address=
                  - --upstream=http://127.0.0.1:8080
                  - --upstream-timeout=10m
                  - --tls-cert=/etc/tls/private/tls.crt
                  - --tls-key=/etc/tls/private/tls.key
                  - --cookie-secret-file=/etc/proxy/cookie/secret
                  - --openshift-service-account=open-webui-proxy
                  - '--openshift-sar={"namespace": "{{hub $ns hub}}", "resource": "services", "resourceName": "open-webui-proxy", "verb": "get"}'
                  - --pass-basic-auth=false
                  - --pass-user-headers=true
                  - --skip-provider-button=true
                ports:
                  - name: https
                    containerPort: 8443
                    protocol: TCP
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                readinessProbe:
                  httpGet:
                    path: /oauth/healthz
                    port: https
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 3
                livenessProbe:
                  httpGet:
                    path: /oauth/healthz
                    port: https
                    scheme: HTTPS
                  periodSeconds: 30
                  timeoutSeconds: 3
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
                volumeMounts:
                  - name: proxy-tls
                    mountPath: /etc/tls/private
                    readOnly: true
                  - name: proxy-cookie
                    mountPath: /etc/proxy/cookie
                    readOnly: true
              {{hub- end hub}}
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: open-webui-data
              - name: tmp
                emptyDir: {}
              {{hub- if $openshift hub}}
              - name: proxy-tls
                secret:
                  secretName: open-webui-proxy-tls
              - name: proxy-cookie
                emptyDir: {}
              {{hub- end hub}}
  {{hub- if $openshift hub}}
  # The service CA issues the proxy's serving certificate into open-webui-proxy-tls; the
  # reencrypt Route trusts that CA without being given it.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Service
      metadata:
        name: open-webui-proxy
        namespace: '{{hub $ns hub}}'
        labels:
          app.kubernetes.io/name: open-webui
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: open-webui-proxy-tls
      spec:
        selector:
          app.kubernetes.io/name: open-webui
        ports:
          - name: https
            port: 8443
            targetPort: https
            protocol: TCP
  {{hub- else hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Service
      metadata:
        name: open-webui
        namespace: '{{hub $ns hub}}'
        labels:
          app.kubernetes.io/name: open-webui
      spec:
        selector:
          app.kubernetes.io/name: open-webui
        ports:
          - name: http
            port: 8080
            targetPort: http
            protocol: TCP
  {{hub- end hub}}
  # A Hermes agent turn can run tools for minutes; HAProxy's default timeout is 30 seconds.
  - complianceType: musthave
    objectDefinition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: open-webui
        namespace: '{{hub $ns hub}}'
        labels:
          app.kubernetes.io/name: open-webui
        annotations:
          haproxy.router.openshift.io/timeout: 10m
      spec:
        host: '{{ $host }}'
        to:
          kind: Service
          {{hub- if $openshift hub}}
          name: open-webui-proxy
          {{hub- else hub}}
          name: open-webui
          {{hub- end hub}}
          weight: 100
        port:
          {{hub- if $openshift hub}}
          targetPort: https
          {{hub- else hub}}
          targetPort: http
          {{hub- end hub}}
        tls:
          {{hub- if $openshift hub}}
          termination: reencrypt
          {{hub- else hub}}
          termination: edge
          {{hub- end hub}}
          insecureEdgeTerminationPolicy: Redirect
        wildcardPolicy: None
