# Is Hermes' Models-as-a-Service key valid, and is it renewing itself?
#
# inform-only. The key is minted by the pod and kept in the hermes-maas-key Secret, whose
# annotations record when it expires. The container restarts at the start of the renewal window
# to mint the replacement; this check reports when that self-healing has not happened:
#   - expired: Hermes cannot reach its model, and every request returns a 401;
#   - renewal more than two hours overdue: the restart did not renew it. The pod's [bootstrap]
#     log says why, usually that maas-api refused or was unreachable.
#
# A clock-based condition never fires an event, so the default watch evaluation would never
# re-evaluate it. policy-generator-config.yaml gives this policy a fixed interval instead.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- $cfg := ($raw | fromYaml | default dict) hub}}
  {{hub- $h := (index $cfg "hermesAgent" | default dict) hub}}
  {{hub- if not (dig "model" "" $h) hub}}{{hub fail "hermes-agent: config.hermesAgent.model is required, the name of a model in config.openshiftAiModels.models" hub}}{{hub- end hub}}
  {{hub- $ns := (dig "namespace" "hermes" $h) hub}}
  {{hub- $renew := (dig "renewBefore" "168h" $h) hub}}
  {{hub- if not (regexMatch "^[1-9][0-9]*h$" $renew) hub}}{{hub fail (printf "hermes-agent: config.hermesAgent.renewBefore %s must be a whole number of hours, for example 168h" $renew) hub}}{{hub- end hub}}
  {{- $key := (lookup "v1" "Secret" "{{hub $ns hub}}" "hermes-maas-key") | default dict }}
  {{- if (dig "metadata" "name" "" $key) }}
  {{- $expires := atoi (dig "metadata" "annotations" "hermes.autoshift.io/expires-at" "0" $key) }}
  {{- $renewAt := sub $expires (mul {{hub (atoi (trimSuffix "h" $renew)) hub}} 3600) }}
  {{- if lt $expires (now).Unix }}{{ fail (printf "hermes-agent: the MaaS key in {{hub $ns hub}}/hermes-maas-key expired at %s; Hermes cannot reach its model. Check the hermes-agent pod's [bootstrap] log" (date "2006-01-02T15:04Z" $expires)) }}{{- end }}
  {{- if lt (add $renewAt 7200) (now).Unix }}{{ fail (printf "hermes-agent: the MaaS key in {{hub $ns hub}}/hermes-maas-key was due for renewal at %s and has not been renewed; it expires at %s. Check the hermes-agent pod's [bootstrap] log" (date "2006-01-02T15:04Z" $renewAt) (date "2006-01-02T15:04Z" $expires)) }}{{- end }}
  {{- end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hermes-maas-key
        namespace: '{{hub $ns hub}}'
