# Does the database Secret maas-api needs actually exist?
#
# maas-api reads its PostgreSQL connection URL from a Secret, once, at startup.
# Without it the pod does not degrade — it exits:
#
#   error: failed to load database URL: failed to read secret
#   redhat-ai-gateway-infra/maas-db-config: secrets "maas-db-config" not found
#
# and CrashLoopBackOffs indefinitely. What an operator sees three layers away is
# an authenticated request to the gateway answered with "no healthy upstream",
# which points at the gateway rather than at a missing database. Every other
# MaaS policy reports Compliant throughout, because every other MaaS policy is
# doing exactly what it was asked.
#
# This assertion exists to make the cause visible at the layer that owns it.
#
# inform-only and content-free: it checks the Secret is present, never what is
# in it. The connection URL carries a password and is created out of band — by
# scripts/maas-database.sh against RDS, or by hand for an in-cluster database —
# so it is deliberately not something a policy supplies.
#
# Namespace note: maas-api moved to redhat-ai-gateway-infra in RHOAI 3.5. On 3.4
# it was redhat-ods-applications, and procedures written for that release name
# the older namespace.
object-templates-raw: |
  {{hub- $ns := (index .ManagedClusterLabels "autoshift.io/openshift-ai-maas-db-namespace" | default "redhat-ai-gateway-infra") hub}}
  {{hub- $name := (index .ManagedClusterLabels "autoshift.io/openshift-ai-maas-db-secret" | default "maas-db-config") hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{hub $name hub}}
        namespace: {{hub $ns hub}}
