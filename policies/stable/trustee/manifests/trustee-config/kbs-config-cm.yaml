apiVersion: v1
kind: ConfigMap
metadata:
  name: kbs-config-cm
  namespace: trustee-operator-system
data:
  kbs-config.toml: |
    [http_server]
    sockets = ["0.0.0.0:8080"]
    insecure_http = true

    [admin]
    authorization_mode = "InsecureAllowAll"

    [attestation_token]
    attestation_token_type = "CoCo"
    trusted_certs_paths = ["/etc/attestation-cert/cert"]

    [attestation_service]
    type = "coco_as_builtin"
    timeout = 5

    [attestation_service.attestation_token_broker]
    duration_min = 5

    [attestation_service.attestation_token_broker.signer]
    key_path = "/etc/attestation-key/key"
    cert_path = "/etc/attestation-cert/cert"

    [attestation_service.rvps_config]
    type = "BuiltIn"

    [storage_backend]
    storage_type = "LocalFs"

    [storage_backend.backends.local_fs]
    dir_path = "/opt/confidential-containers/storage"

    [[plugins]]
    name = "resource"
    storage_backend_type = "kvstorage"
