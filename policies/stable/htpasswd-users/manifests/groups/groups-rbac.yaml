# Groups for htpasswd users, and the role bindings each group gets.
#
# Group is mustonlyhave because users is a list: under musthave, removing a user from config would
# leave them in the live Group indefinitely while the policy reported Compliant. This policy owns
# these Groups outright.
#
# Removing a user from a group does NOT revoke MaaS API keys they already minted. Per the RHOAI 3.5
# Models-as-a-Service documentation, keys must be revoked by hand when a user leaves a group.
#
# RBAC is opt-in per group and deliberately absent by default. Minting a MaaS API key needs no
# Kubernetes RBAC at all: MaaS checks only that the caller's groups appear in the subscription's
# owner.groups and the auth policy's subjects.groups. Bind roles here only for what a person
# actually does beyond calling models - looking at the model deployment, say.
#
# A RoleBinding into a namespace that does not exist yet (the model namespace is created by
# openshift-ai-models) reports NonCompliant until that namespace appears, then reconciles on its
# own. It is not an error worth acting on.
object-templates-raw: |
  {{hub- $policyNs := .PolicyMetadata.namespace hub}}
  {{hub- $rcm := (lookup "v1" "ConfigMap" $policyNs (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $cfg := (dig "htpasswdUsers" (dict) ((dig "data" "config" "" $rcm) | fromYaml | default dict)) hub}}
  {{hub- range $g := (dig "groups" (list) $cfg) hub}}
  {{hub- $gname := (dig "name" "" $g) hub}}
  {{hub- if $gname hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: user.openshift.io/v1
      kind: Group
      metadata:
        name: {{hub $gname hub}}
      users: {{hub (dig "users" (list) $g) | toJson hub}}
  {{hub- range $role := (dig "clusterRoles" (list) $g) hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: htpasswd-{{hub $gname hub}}-{{hub $role hub}}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{hub $role hub}}
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: {{hub $gname hub}}
  {{hub- end hub}}
  {{hub- range $nr := (dig "namespaceRoles" (list) $g) hub}}
  {{hub- $ns := (dig "namespace" "" $nr) hub}}
  {{hub- $role := (dig "role" "" $nr) hub}}
  {{hub- if and $ns $role hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: htpasswd-{{hub $gname hub}}-{{hub $role hub}}
        namespace: {{hub $ns hub}}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{hub $role hub}}
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: {{hub $gname hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
