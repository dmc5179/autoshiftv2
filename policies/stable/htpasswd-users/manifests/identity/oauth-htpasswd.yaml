# Add an HTPasswd identity provider to the cluster OAuth configuration.
#
# musthave, NOT mustonlyhave, and that choice is load-bearing. OAuth/cluster is a singleton that
# also carries every other identity provider. mustonlyhave on spec would replace
# spec.identityProviders with this one entry and could lock every other user out of the cluster.
# manual-remediations/manifests/oauth-customization.yaml carries the same warning. musthave merges
# this entry into the existing list and leaves the others alone.
#
# The cost of musthave on a list: changing providerName or secretName in place APPENDS a second
# entry rather than replacing the first (see docs/policy-behavior.md). Two providers with the same
# name degrade the authentication operator. To rename, remove the old entry by hand first.
#
# GUARDED ON THE SECRET EXISTING. The htpasswd Secret holds password hashes and is created out of
# band (scripts/maas-user.sh), never by this policy. Pointing OAuth at a Secret that does not exist
# degrades the authentication operator, so the entry is only emitted once the Secret is present.
# Until then this policy renders nothing for OAuth; once the Secret appears, the next evaluation
# adds the provider. The order the Secret and the policy arrive in therefore does not matter.
object-templates-raw: |
  {{hub- $policyNs := .PolicyMetadata.namespace hub}}
  {{hub- $rcm := (lookup "v1" "ConfigMap" $policyNs (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $cfg := (dig "htpasswdUsers" (dict) ((dig "data" "config" "" $rcm) | fromYaml | default dict)) hub}}
  {{hub- $provider := (dig "providerName" "htpasswd" $cfg) hub}}
  {{hub- $secret := (dig "secretName" "htpasswd-users" $cfg) hub}}
  {{- if (lookup "v1" "Secret" "openshift-config" "{{hub $secret hub}}") }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: OAuth
      metadata:
        name: cluster
      spec:
        identityProviders:
          - name: {{hub $provider hub}}
            # claim: a login maps to the User of the same name. The Group membership in
            # manifests/groups refers to that name.
            mappingMethod: claim
            type: HTPasswd
            htpasswd:
              fileData:
                name: {{hub $secret hub}}
  {{- end }}
