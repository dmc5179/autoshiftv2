# Are htpasswd logins actually working, as opposed to configured?
#
# inform-only. Three conditions, because they fail independently:
#
#   - the htpasswd Secret exists. The enforcing policy deliberately adds nothing to OAuth until it
#     does, so a missing Secret shows up as "nothing happened" rather than an error. This is the
#     assertion that names the cause: create the Secret in openshift-config, with the htpasswd
#     file under the key htpasswd.
#   - OAuth carries the identity provider.
#   - the authentication operator is not Degraded. A provider pointing at a malformed Secret is
#     accepted by the API server and only fails here, so this is the signal that logins work.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- $cfg := (index ($raw | fromYaml | default dict) "htpasswdUsers") hub}}
  {{hub- if not $cfg hub}}
  {{hub- fail "htpasswd-users: config.htpasswdUsers is missing or empty in the rendered-config ConfigMap" hub}}
  {{hub- end hub}}
  {{hub- $provider := (dig "providerName" "htpasswd" $cfg) hub}}
  {{hub- $secret := (dig "secretName" "htpasswd-users" $cfg) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{hub $secret hub}}
        namespace: openshift-config
  - complianceType: musthave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: OAuth
      metadata:
        name: cluster
      spec:
        identityProviders:
          - name: {{hub $provider hub}}
            type: HTPasswd
  - complianceType: musthave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: ClusterOperator
      metadata:
        name: authentication
      status:
        conditions:
          - type: Degraded
            status: 'False'
          - type: Available
            status: 'True'
