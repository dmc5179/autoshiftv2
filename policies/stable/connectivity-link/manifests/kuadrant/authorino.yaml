# Cluster-wide Authorino, with TLS on the listener. MaaS talks to Authorino
# over TLS to authorise API keys; the cert lands in authorino-server-cert.
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: kuadrant-system
spec:
  clusterWide: true
  replicas: 1
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: authorino-server-cert
  oidcServer:
    tls:
      enabled: false
