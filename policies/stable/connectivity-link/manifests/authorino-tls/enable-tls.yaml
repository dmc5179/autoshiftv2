# Turn on TLS for the Authorino gRPC listener, now that the certificate
# exists. Applied only after policy-rhcl-authorino-cert-ready confirms the
# Secret has been issued — see manifests/kuadrant/authorino.yaml for why the
# order matters.
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: kuadrant-system
spec:
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: authorino-server-cert
