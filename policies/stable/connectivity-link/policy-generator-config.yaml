apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: connectivity-link
# Per-deployment scalars (${...}) are substituted by the repo-server CMP (envsubst/sed) BEFORE
# `kustomize build` runs. They live here and in placement.yaml — never in manifests/, whose hub
# templates contain `$vars` that substitution would clobber.
#
# The operator-install policy points at manifests/operator-install/, a nested kustomization that
# renders the shared components/operator-install chart. Add further CRs as new policies[] entries
# pointing at their own manifests/<dir> (a wildcarded dir picks up drop-in files automatically).
# Keep placement.yaml OUT of manifests/ (a Placement inside a wildcarded dir would be wrapped in).
# Several policies share placement.yaml, so the shared PlacementBinding
# needs an explicit name.
placementBindingDefaults:
  name: binding-policy-rhcl
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: high
  # Consolidate the raw Namespace into one generated ConfigurationPolicy; the first-class
  # OperatorPolicy stays its own policy-template. Net: one Policy, two policy-templates.
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  # Placement authored by us (placement.yaml at the dir root, full fidelity); PG includes it and
  # generates only the PlacementBinding.
  placement:
    placementPath: placement.yaml
policies:
  - name: policy-rhcl-operator-install
    manifests:
      - path: manifests/operator-install
  # Kuadrant and Authorino CRs. Separate from the install because their CRDs
  # arrive with the CSV, and a ConfigurationPolicy for an unknown kind reports
  # Compliant while doing nothing.
  - name: policy-rhcl-kuadrant
    consolidateManifests: false
    dependencies:
      - name: policy-rhcl-operator-install
    manifests:
      - path: manifests/kuadrant
  # inform: MaaS blocks on Kuadrant being Ready, so surface it here rather
  # than letting it present as an unprogrammed gateway later.
  - name: policy-rhcl-ready
    remediationAction: inform
    dependencies:
      - name: policy-rhcl-kuadrant
    manifests:
      - path: test/kuadrant-ready.yaml
  # Authorino listener TLS, in three steps because the pieces are circular.
  # Authorino will not start without the certificate; the certificate is
  # issued by service-ca in response to an annotation on the Authorino
  # Service; and that Service does not exist until Authorino starts. So the
  # CR ships with TLS off, the Service is annotated once it exists, and TLS
  # is enabled only after the Secret has appeared.
  #
  # Doing all three in one policy would not be safe: a ConfigurationPolicy
  # gives no ordering between the objects it applies, so TLS could be enabled
  # in the same pass that requests the certificate.
  - name: policy-rhcl-authorino-cert
    dependencies:
      - name: policy-rhcl-ready
    manifests:
      - path: manifests/authorino-cert
  - name: policy-rhcl-authorino-cert-ready
    remediationAction: inform
    dependencies:
      - name: policy-rhcl-authorino-cert
    manifests:
      - path: test/authorino-cert-ready.yaml
  - name: policy-rhcl-authorino-tls
    dependencies:
      - name: policy-rhcl-authorino-cert-ready
    manifests:
      - path: manifests/authorino-tls
