apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-openshift-ai-models
  namespace: ${POLICY_NAMESPACE}
spec:
  # No spec.clusterSets: selects across all ManagedClusterSetBindings in this namespace,
  # filtered by the predicate below.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/cluster-type'
              operator: In
              values:
                - 'spoke'
            - key: 'autoshift.io/openshift-ai-models'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
