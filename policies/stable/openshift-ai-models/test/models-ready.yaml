# Did each configured model actually come up?
#
# inform-only: a status can only be observed. This is the policy that tells you a model is
# serving, as opposed to merely having been created - the gap between the two is where the
# interesting failures live (modelcar pull, no schedulable GPU, vLLM failing to load weights),
# and all of them leave a perfectly healthy-looking LLMInferenceService behind.
#
# Readiness is asserted on the LLMInferenceService's Ready condition rather than on a Deployment
# name, because KServe owns the workload naming and it is not ours to predict.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- $cfg := (index ($raw | fromYaml | default dict) "openshiftAiModels" | default dict) hub}}
  {{hub- $ns := (dig "namespace" "" $cfg) hub}}
  {{hub- if not $ns hub}}{{hub fail "openshift-ai-models: config.openshiftAiModels.namespace is required" hub}}{{hub- end hub}}
  {{hub- $models := (dig "models" (list) $cfg) hub}}
  {{hub- if not $models hub}}{{hub fail "openshift-ai-models: config.openshiftAiModels.models is missing or empty" hub}}{{hub- end hub}}
  {{hub- range $m := $models hub}}
  {{hub- if not (and (dig "name" "" $m) (dig "uri" "" $m) (dig "image" "" $m)) hub}}{{hub fail "openshift-ai-models: every config.openshiftAiModels.models entry needs name, uri and image" hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- range $m := $models hub}}
  {{hub- $name := (dig "name" "" $m) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: serving.kserve.io/v1alpha1
      kind: LLMInferenceService
      metadata:
        name: {{hub $name hub}}
        namespace: {{hub $ns hub}}
      status:
        conditions:
          - type: Ready
            status: 'True'
  - complianceType: musthave
    objectDefinition:
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: MaaSModelRef
      metadata:
        name: {{hub $name hub}}
        namespace: {{hub $ns hub}}
  {{hub- end hub}}
