# Register each MCP server in config.mcpGateway.servers with its gateway instance.
#
# The MCP Lifecycle Operator in Red Hat OpenShift AI deploys a catalog MCP server as an
# MCPServer with a Deployment and a Service, and stops there: it creates no HTTPRoute and no
# MCPServerRegistration. Registration is these two objects per server:
#
#   HTTPRoute               attaches the server's Service to the instance's internal
#                           listener under a <namespace>-<name>.mcp.local hostname
#   MCPServerRegistration   tells the broker to federate the server's tools under a prefix
#
# The server's namespace is not created here. A registration for a server that was never
# deployed should fail on the missing namespace, not succeed against an empty one.
#
# Fails when config.mcpGateway.servers is empty (this policy has its own enablement label, so
# being placed means servers were asked for), when a server lacks name, namespace, port or
# prefix, or when it names an instance that config.mcpGateway.instances does not define.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- $cfg := (index ($raw | fromYaml | default dict) "mcpGateway" | default dict) hub}}
  {{hub- $instances := (dig "instances" (list) $cfg) hub}}
  {{hub- if not $instances hub}}{{hub fail "mcp-gateway: config.mcpGateway.instances is missing or empty" hub}}{{hub- end hub}}
  {{hub- $servers := (dig "servers" (list) $cfg) hub}}
  {{hub- if not $servers hub}}{{hub fail "mcp-gateway: the mcp-gateway-servers label is on but config.mcpGateway.servers is missing or empty" hub}}{{hub- end hub}}
  {{hub- $firstInstance := (dig "name" "" (first $instances)) hub}}
  {{hub- range $s := $servers hub}}
  {{hub- if not (and (dig "name" "" $s) (dig "namespace" "" $s) (dig "port" "" $s) (dig "prefix" "" $s)) hub}}{{hub fail "mcp-gateway: every config.mcpGateway.servers entry needs name, namespace, port and prefix" hub}}{{hub- end hub}}
  {{hub- $instName := (dig "instance" $firstInstance $s) hub}}
  {{hub- $inst := dict hub}}
  {{hub- range $i := $instances hub}}
  {{hub- if eq (dig "name" "" $i) $instName hub}}
  {{hub- $inst = $i hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- if not $inst hub}}{{hub fail (printf "mcp-gateway: server %s names instance %s, which config.mcpGateway.instances does not define" (dig "name" "" $s) $instName) hub}}{{hub- end hub}}
  {{hub- $name := (dig "name" "" $s) hub}}
  {{hub- $ns := (dig "namespace" "" $s) hub}}
  {{hub- $route := (printf "%s-mcp" $name) hub}}
  # mustonlyhave: parentRefs and backendRefs are object lists. Under musthave, changing the
  # port would add a second backendRef beside the first and split traffic between them.
  # Every field the API server would default is written out, so the comparison is stable.
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: {{hub $route hub}}
        namespace: {{hub $ns hub}}
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: {{hub (dig "gateway" "name" $instName $inst) hub}}
            namespace: {{hub (dig "gateway" "namespace" "openshift-ingress" $inst) hub}}
            sectionName: mcp-internal
        hostnames:
          - {{hub $ns hub}}-{{hub $name hub}}.mcp.local
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - group: ''
                kind: Service
                name: {{hub (dig "service" $name $s) hub}}
                port: {{hub (dig "port" "" $s) hub}}
                weight: 1
  # prefix is immutable in the CRD. Changing it in config makes this policy NonCompliant with
  # the API server's rejection; delete the registration to take the new prefix.
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: mcp.kuadrant.io/v1
      kind: MCPServerRegistration
      metadata:
        name: {{hub $name hub}}
        namespace: {{hub $ns hub}}
      spec:
        targetRef:
          group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: {{hub $route hub}}
          namespace: {{hub $ns hub}}
        prefix: {{hub (dig "prefix" "" $s) | quote hub}}
        path: {{hub (dig "path" "/mcp" $s) | quote hub}}
        state: Enabled
        userSpecificList: Disabled
        category: {{hub (dig "category" (list "uncategorised") $s) | toJson hub}}
        {{hub- if (dig "hint" "" $s) hub}}
        hint: {{hub (dig "hint" "" $s) | quote hub}}
        {{hub- end hub}}
        {{hub- if (dig "credentialSecret" "name" "" $s) hub}}
        # Created out of band, never from values, and labeled mcp.kuadrant.io/secret=true.
        credentialRef:
          name: {{hub (dig "credentialSecret" "name" "" $s) hub}}
          key: {{hub (dig "credentialSecret" "key" "token" $s) hub}}
        {{hub- end hub}}
  {{hub- end hub}}
