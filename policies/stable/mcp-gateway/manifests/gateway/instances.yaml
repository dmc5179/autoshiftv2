# One MCP gateway instance per entry in config.mcpGateway.instances.
#
# An instance is four objects, and the MCP Gateway controller wires them together:
#
#   Gateway               the Envoy listener pair: "mcp" is the public, authenticated
#                         endpoint; "mcp-internal" carries the *.mcp.local hostnames that
#                         MCP server HTTPRoutes attach to
#   ReferenceGrant        lets the MCPGatewayExtension, in its own namespace, name the
#                         Gateway in the Gateway namespace
#   MCPGatewayExtension   the instance itself. The controller deploys the broker-router
#                         Deployment and Service in this namespace, an EnvoyFilter in the
#                         Gateway namespace, and the HTTPRoute for /mcp on the public listener
#   AuthPolicy            Kuadrant authentication on the public listener only
#
# The MCP Gateway controller itself is not installed here. Connectivity Link 1.5 deploys it
# through the KuadrantControlPlane named default, which nothing in this policy reads or writes.
#
# Fails, rather than rendering nothing, when the rendered-config ConfigMap is missing, when
# config.mcpGateway.instances is empty, or when an instance lacks name, namespace or a valid
# auth.type. auth.type has no default on purpose: an unauthenticated tool endpoint should be
# a decision someone wrote down, not what happens when a key is forgotten.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- $cfg := (index ($raw | fromYaml | default dict) "mcpGateway" | default dict) hub}}
  {{hub- $instances := (dig "instances" (list) $cfg) hub}}
  {{hub- if not $instances hub}}{{hub fail "mcp-gateway: config.mcpGateway.instances is missing or empty" hub}}{{hub- end hub}}
  {{hub- range $i := $instances hub}}
  {{hub- if not (and (dig "name" "" $i) (dig "namespace" "" $i)) hub}}{{hub fail "mcp-gateway: every config.mcpGateway.instances entry needs name and namespace" hub}}{{hub- end hub}}
  {{hub- $authType := (dig "auth" "type" "" $i) hub}}
  {{hub- if not (or (eq $authType "none") (eq $authType "kubernetes") (eq $authType "jwt")) hub}}{{hub fail "mcp-gateway: config.mcpGateway.instances[].auth.type is required: none, kubernetes or jwt" hub}}{{hub- end hub}}
  {{hub- if and (eq $authType "jwt") (not (dig "auth" "issuerUrl" "" $i)) hub}}{{hub fail "mcp-gateway: auth.type jwt needs auth.issuerUrl" hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- $servers := (dig "servers" (list) $cfg) hub}}
  {{hub- $firstInstance := (dig "name" "" (first $instances)) hub}}
  {{- $domain := (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain }}
  {{- $routerCert := (dig "spec" "defaultCertificate" "name" "router-certs-default" ((lookup "operator.openshift.io/v1" "IngressController" "openshift-ingress-operator" "default") | default dict)) }}
  # Shared and cluster-scoped. openshift-ai-maas declares the same object with the same spec,
  # so the two policies agree rather than fight. Creating it is what makes the Ingress Operator
  # install the Istio control plane, and with it the EnvoyFilter CRD the MCP Gateway controller
  # needs. That is why the EnvoyFilter CRD is asserted in the readiness policy, not as a
  # prerequisite: as a prerequisite it would wait on an object this policy creates.
  - complianceType: musthave
    objectDefinition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: openshift-default
      spec:
        controllerName: openshift.io/gateway-controller/v1
  {{hub- range $i := $instances hub}}
  {{hub- $name := (dig "name" "" $i) hub}}
  {{hub- $ns := (dig "namespace" "" $i) hub}}
  {{hub- $gwName := (dig "gateway" "name" $name $i) hub}}
  {{hub- $gwNs := (dig "gateway" "namespace" "openshift-ingress" $i) hub}}
  {{hub- $gwClass := (dig "gateway" "className" "openshift-default" $i) hub}}
  {{hub- $host := (dig "gateway" "hostname" "" $i) hub}}
  {{hub- $tlsSecret := (dig "gateway" "tlsSecretName" "" $i) hub}}
  {{hub- $port := (dig "gateway" "internalPort" 8080 $i) hub}}
  {{hub- $authType := (dig "auth" "type" "" $i) hub}}
  # Namespaces allowed to attach routes to the internal listener: the instance namespace,
  # the namespace of every server registered to this instance, and any listed explicitly.
  # Not "All": the internal listener shares the Gateway Service, so a route attached from an
  # arbitrary namespace would be reachable through it without passing the AuthPolicy.
  {{hub- $routeNs := (list $ns) hub}}
  {{hub- range $s := $servers hub}}
  {{hub- $sNs := (dig "namespace" "" $s) hub}}
  {{hub- if and $sNs (eq (dig "instance" $firstInstance $s) $name) (not (has $sNs $routeNs)) hub}}
  {{hub- $routeNs = (append $routeNs $sNs) hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- range $x := (dig "extraRouteNamespaces" (list) $i) hub}}
  {{hub- if not (has $x $routeNs) hub}}
  {{hub- $routeNs = (append $routeNs $x) hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{hub $ns hub}}
  # mustonlyhave: listeners and the namespace selector values are lists, and musthave
  # merges lists. Removing a server namespace from config would leave it attached.
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: {{hub $gwName hub}}
        namespace: {{hub $gwNs hub}}
      spec:
        gatewayClassName: {{hub $gwClass hub}}
        listeners:
          - name: mcp
            hostname: {{hub if $host hub}}{{hub $host hub}}{{hub else hub}}{{hub $name hub}}.{{ $domain }}{{hub end hub}}
            port: 443
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
                - group: ''
                  kind: Secret
                  name: {{hub if $tlsSecret hub}}{{hub $tlsSecret hub}}{{hub else hub}}{{ $routerCert }}{{hub end hub}}
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{hub $ns hub}}
          - name: mcp-internal
            hostname: '*.mcp.local'
            port: {{hub $port hub}}
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values: {{hub $routeNs | toJson hub}}
  {{hub- if ne $gwNs $ns hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: mcp-{{hub $ns hub}}-{{hub $name hub}}
        namespace: {{hub $gwNs hub}}
      spec:
        from:
          - group: mcp.kuadrant.io
            kind: MCPGatewayExtension
            namespace: {{hub $ns hub}}
        to:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: {{hub $gwName hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: mcp.kuadrant.io/v1
      kind: MCPGatewayExtension
      metadata:
        name: {{hub $name hub}}
        namespace: {{hub $ns hub}}
      spec:
        targetRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: {{hub $gwName hub}}
          namespace: {{hub $gwNs hub}}
          sectionName: mcp
        # The broker reaches registered servers back through the Gateway. Pointed at the
        # plain-HTTP internal listener explicitly: the derived default follows the public
        # listener, which is HTTPS and would need the Gateway CA in caCertBundleRef.
        privateHost: http://{{hub $gwName hub}}-{{hub $gwClass hub}}.{{hub $gwNs hub}}.svc.cluster.local:{{hub $port hub}}
        logLevel: {{hub (dig "logLevel" "info" $i) hub}}
        {{hub- if eq $authType "jwt" hub}}
        oauthProtectedResource:
          authorizationServers:
            - {{hub (dig "auth" "issuerUrl" "" $i) hub}}
        {{hub- end hub}}
  {{hub- if ne $authType "none" hub}}
  # mustonlyhave: switching auth.type under musthave would merge the new method beside the
  # old one, and Authorino accepts a request when any one method succeeds.
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: kuadrant.io/v1
      kind: AuthPolicy
      metadata:
        name: {{hub $name hub}}-mcp
        namespace: {{hub $gwNs hub}}
      spec:
        # The public listener only. The internal listener carries the broker's own calls to
        # the servers, and MCP server credentials are handled per server by the broker.
        targetRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: {{hub $gwName hub}}
          sectionName: mcp
        # MCP clients discover the authorization server here before they have a token.
        when:
          - predicate: '!request.path.startsWith("/.well-known/oauth-protected-resource")'
        rules:
          authentication:
            {{hub- if eq $authType "kubernetes" hub}}
            # OpenShift user tokens and ServiceAccount tokens, through a TokenReview.
            kubernetes:
              kubernetesTokenReview:
                audiences: {{hub (dig "auth" "audiences" (list "https://kubernetes.default.svc") $i) | toJson hub}}
            {{hub- else hub}}
            oidc:
              jwt:
                issuerUrl: {{hub (dig "auth" "issuerUrl" "" $i) hub}}
            {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
