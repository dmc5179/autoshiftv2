# The component set. Two things here are load-bearing and non-obvious:
#
#   llamastackoperator MUST be Removed. It is deprecated in favour of ogx, and
#   leaving it Managed - or unset, which defaults to Managed on an existing
#   DSC - makes the operator reject ogx. That failure aborts the whole
#   module-provisioning batch at runlevel 32, which in turn prevents aigateway
#   from installing its CRDs. The symptom is that MaaS never appears, even
#   though modelsAsAService reads Managed.
#
#   aigateway.modelsAsAService is deliberately absent. It is what turns MaaS
#   on, and the openshift-ai-maas policy sets it to Managed, alongside the
#   Gateway MaaS attaches to, by patching this same object once it exists.
#   musthave on both sides merges only the fields each lists, so leaving it
#   out here is what stops this policy from overwriting that one. Turning the
#   autoshift.io/openshift-ai-maas label off stops that management and removes
#   nothing.
#
# The spec is this base with config.openshift-ai.dataScienceCluster from the cluster's
# rendered-config merged over it, the same config.openshift-ai key the version pin reads. Any
# component's managementState or settings can be changed per clusterset or cluster; maps merge key
# by key and config wins. Two fields config cannot set: llamastackoperator stays Removed and
# aigateway.modelsAsAService stays unset, for the reasons above, so a configured value for either
# is dropped.
#
# Base component choices (each overridable through config): llamastackoperator Removed and ogx
# Managed, as above; kueue and trainer Removed, since both need an operator this policy does not
# install (Red Hat build of Kueue, the Kubeflow Trainer v2 prerequisites); everything else Managed.
object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $cfg := (index (index $cm "data" | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $spec := (`
  components:
    aipipelines:
      managementState: Managed
    dashboard:
      managementState: Managed
    feastoperator:
      managementState: Managed
    aigateway:
      managementState: Managed
    kserve:
      managementState: Managed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headed
    kueue:
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: Removed
    ogx:
      managementState: Managed
    llamastackoperator:
      managementState: Removed
    mlflowoperator:
      managementState: Managed
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Managed
    trainer:
      managementState: Removed
    trainingoperator:
      managementState: Managed
    trustyai:
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
      managementState: Managed
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
  ` | fromYaml) hub}}
  {{hub- $spec = (mergeOverwrite $spec (dig "openshift-ai" "dataScienceCluster" (dict) $cfg)) hub}}
  {{hub- $_ := set (index (index $spec "components") "llamastackoperator") "managementState" "Removed" hub}}
  {{hub- $_ := set (index $spec "components") "aigateway" (omit (index (index $spec "components") "aigateway") "modelsAsAService") hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: datasciencecluster.opendatahub.io/v2
      kind: DataScienceCluster
      metadata:
        name: default-dsc
        labels:
          app.kubernetes.io/name: datasciencecluster
      spec:
        {{hub $spec | toYaml | autoindent hub}}
