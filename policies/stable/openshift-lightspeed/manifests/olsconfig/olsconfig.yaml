# Points the console assistant at a model served locally through MaaS, so
# cluster questions are answered on your own hardware rather than by a SaaS
# provider.
#
# Three details that are easy to get wrong, all from the Lightspeed docs:
#   - the Secret key is always "apitoken", whatever the provider calls it
#   - the provider URL must end in /v1
#   - rhoai_vllm is the right type for a self-hosted vLLM endpoint
#
# The URL is discovered on the managed cluster, the same way the MaaS gateway
# builds its hostname, so this works on any cluster without being told its
# DNS. The domain comes from the cluster Ingress config
# (ingresses.config.openshift.io/cluster), which is always populated. The
# default IngressController's spec.domain is set only when someone configures
# it; reading it renders "https://maas.%!s(<nil>)/v1", a valid string that
# gives an assistant failing every request.
#
# The model id comes from config.openshiftLightspeed.model, not from a label:
# MaaS lists models as publishers/<namespace>/models/<name>, and a slash is
# not allowed in a label value. It has no default, because it cannot be
# discovered from a template (only the gateway's own model listing knows it)
# and a wrong value gives an assistant that errors on every question. A
# missing model fails the policy by name rather than rendering an empty one.
#
# The Secret itself is created out of band by an administrator and is never
# in git. Mint a MaaS API key, then:
#
#   oc create secret generic maas-api-key -n openshift-lightspeed \
#     --from-literal=apitoken=<key>
#
# MaaS keys expire. Lightspeed has no rotation of its own, so use a long TTL
# and re-create the Secret before it lapses.
#
# Optional, all under config.openshiftLightspeed, and each rendered only when set:
#
#   mcpServers           extra MCP servers the assistant may call, for example the MCP gateway.
#                        Renders spec.mcpServers and the MCPServer feature gate (Technology
#                        Preview). Each entry has a literal url, or ingressHost (and path,
#                        default /mcp) to build https://<ingressHost>.<ingress domain><path> on
#                        the managed cluster, the way the provider URL is built. timeout defaults
#                        to 60 seconds here; the CRD's own default of 5 is shorter than a
#                        documentation search. 'openshift' is refused as a name: it is the
#                        operator's built-in server.
#   toolResultInspection true or false. Renders spec.ols.guardrails.toolResultInspection.enabled.
#                        Unset leaves the operator default, enabled. false is the documented
#                        workaround for the OpenShift Lightspeed 1.1.5 known issue "Tool-result
#                        inspection might fail at the tool call step for certain models", and
#                        for OLS-4416, where classifier errors were reported as unsafe results.
#                        It also turns inspection off for the built-in openshift server.
#   toolBudgetRatio      0.1 to 0.5, the share of the model's context window for tool results.
#                        The CRD defaults it to 0.5.
#
# musthave never removes a list entry: deleting an MCP server from config leaves it in the
# OLSConfig, and unsetting toolResultInspection leaves the last value. Set the value you want
# rather than removing it, and remove a server by hand:
#   oc patch olsconfigs.ols.openshift.io cluster --type=json \
#     -p '[{"op":"remove","path":"/spec/mcpServers/<index>"}]'
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "") hub}}
  {{hub- $cfg := (index ($raw | fromYaml | default dict) "openshiftLightspeed" | default dict) hub}}
  {{hub- $model := (dig "model" "" $cfg) hub}}
  {{hub- if not $model hub}}{{hub fail "openshift-lightspeed: config.openshiftLightspeed.model is required; set it to a model id the MaaS gateway lists" hub}}{{hub- end hub}}
  {{hub- $tri := (printf "%v" (dig "toolResultInspection" "" $cfg)) hub}}
  {{hub- if not (has $tri (list "" "true" "false")) hub}}{{hub fail (printf "openshift-lightspeed: config.openshiftLightspeed.toolResultInspection %s must be true or false" $tri) hub}}{{hub- end hub}}
  {{hub- $tbr := (printf "%v" (dig "toolBudgetRatio" "" $cfg)) hub}}
  {{hub- if and $tbr (not (regexMatch "^0?\\.([1-4][0-9]*|50*)$" $tbr)) hub}}{{hub fail (printf "openshift-lightspeed: config.openshiftLightspeed.toolBudgetRatio %s must be from 0.1 to 0.5" $tbr) hub}}{{hub- end hub}}
  {{hub- $mcp := (dig "mcpServers" (list) $cfg) hub}}
  {{hub- $names := (list) hub}}
  {{hub- range $m := $mcp hub}}
  {{hub- $n := (dig "name" "" $m) hub}}
  {{hub- if not $n hub}}{{hub fail "openshift-lightspeed: every config.openshiftLightspeed.mcpServers entry needs a name" hub}}{{hub- end hub}}
  {{hub- if eq $n "openshift" hub}}{{hub fail "openshift-lightspeed: mcpServers name openshift is the operator's built-in server; choose another name" hub}}{{hub- end hub}}
  {{hub- if has $n $names hub}}{{hub fail (printf "openshift-lightspeed: mcpServers name %s is listed twice" $n) hub}}{{hub- end hub}}
  {{hub- $names = (append $names $n) hub}}
  {{hub- $url := (dig "url" "" $m) hub}}
  {{hub- $ih := (dig "ingressHost" "" $m) hub}}
  {{hub- if or (and $url $ih) (not (or $url $ih)) hub}}{{hub fail (printf "openshift-lightspeed: mcpServers entry %s needs exactly one of url and ingressHost" $n) hub}}{{hub- end hub}}
  {{hub- if and $url (not (regexMatch "^https?://" $url)) hub}}{{hub fail (printf "openshift-lightspeed: mcpServers entry %s: url must start with http:// or https://" $n) hub}}{{hub- end hub}}
  {{hub- if and $ih (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $ih)) hub}}{{hub fail (printf "openshift-lightspeed: mcpServers entry %s: ingressHost must be a single DNS label, such as mcp" $n) hub}}{{hub- end hub}}
  {{hub- if not (regexMatch "^[1-9][0-9]*$" (printf "%v" (dig "timeout" 60 $m))) hub}}{{hub fail (printf "openshift-lightspeed: mcpServers entry %s: timeout must be a whole number of seconds" $n) hub}}{{hub- end hub}}
  {{hub- range $h := (dig "headers" (list) $m) hub}}
  {{hub- $t := (dig "valueFrom" "type" "" $h) hub}}
  {{hub- if not (and (dig "name" "" $h) (has $t (list "secret" "kubernetes" "client"))) hub}}{{hub fail (printf "openshift-lightspeed: mcpServers entry %s: every header needs a name and valueFrom.type secret, kubernetes or client" $n) hub}}{{hub- end hub}}
  {{hub- if and (eq $t "secret") (not (dig "valueFrom" "secretRef" "name" "" $h)) hub}}{{hub fail (printf "openshift-lightspeed: mcpServers entry %s: a secret header needs valueFrom.secretRef.name, a Secret in openshift-lightspeed" $n) hub}}{{hub- end hub}}
  {{hub- if and (ne $t "secret") (dig "valueFrom" "secretRef" "name" "" $h) hub}}{{hub fail (printf "openshift-lightspeed: mcpServers entry %s: only a secret header takes secretRef" $n) hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{- $domain := (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: ols.openshift.io/v1alpha1
      kind: OLSConfig
      metadata:
        name: cluster
      spec:
        {{hub- if $mcp hub}}
        featureGates:
          - MCPServer
        mcpServers:
          {{hub- range $m := $mcp hub}}
          - name: {{hub (dig "name" "" $m) | quote hub}}
            {{hub- if (dig "url" "" $m) hub}}
            url: {{hub (dig "url" "" $m) | quote hub}}
            {{hub- else hub}}
            url: 'https://{{hub (dig "ingressHost" "" $m) hub}}.{{ $domain }}{{hub (dig "path" "/mcp" $m) hub}}'
            {{hub- end hub}}
            timeout: {{hub (printf "%v" (dig "timeout" 60 $m)) hub}}
            {{hub- if (dig "headers" (list) $m) hub}}
            headers: {{hub (dig "headers" (list) $m) | toJson hub}}
            {{hub- end hub}}
          {{hub- end hub}}
        {{hub- end hub}}
        llm:
          providers:
            - name: maas
              type: rhoai_vllm
              url: '{{ printf "https://maas.%s/v1" $domain }}'
              credentialsSecretRef:
                name: {{hub (dig "secretName" "maas-api-key" $cfg) | quote hub}}
              models:
                - name: {{hub $model | quote hub}}
                  {{hub- if $tbr hub}}
                  parameters:
                    toolBudgetRatio: {{hub $tbr hub}}
                  {{hub- end hub}}
        ols:
          defaultProvider: maas
          defaultModel: {{hub $model | quote hub}}
          {{hub- if $tri hub}}
          guardrails:
            toolResultInspection:
              enabled: {{hub $tri hub}}
          {{hub- end hub}}
